<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C2340">
<title>CallReady</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%231556C0%22/%3E%3Cpath d=%22M20 17h8l4 10-5 3a22 22 0 0 0 10 10l3-5 10 4v8a4 4 0 0 1-4 4A32 32 0 0 1 16 21a4 4 0 0 1 4-4z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --card:#fff; --ink:#0F2438; --muted:#5A6B7D; --line:#E1E7EE; --line-2:#D3DCE6;
  --cobalt:#1556C0; --cobalt-d:#0F4299; --cobalt-50:#EEF4FE; --cobalt-100:#D9E6FB;
  --maize:#F2B33D; --maize-50:#FFF6E0; --night:#0C2340; --night2:#16386A; --night3:#1E4A8A;
  --good:#17835A; --good-50:#E4F4EC; --bad:#B93A3A; --bad-50:#FBEBEB;
  --sh-1:0 1px 2px rgba(15,36,56,.05),0 2px 8px rgba(15,36,56,.05);
  --sh-2:0 2px 4px rgba(15,36,56,.06),0 10px 24px rgba(15,36,56,.10);
  --sh-btn:0 1px 2px rgba(15,66,153,.25),0 6px 16px rgba(21,86,192,.28);
  --r:18px;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 420px at 50% -160px,#DCE7F8 0%,rgba(220,231,248,0) 70%),var(--paper);background-attachment:fixed}
body.in-call{background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
a.btn,a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn.block{display:flex}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.call :focus-visible,.hero :focus-visible{outline-color:var(--maize)}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 14px}
.top h1{flex:1}
.lead{font-size:17px;color:var(--muted);margin:8px 0 22px;max-width:52ch}
section.block{margin-top:28px}
section.block>h2{margin-bottom:12px}
.section-sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

/* entrance motion */
main>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.03s} main>*:nth-child(3){animation-delay:.06s}
main>*:nth-child(4){animation-delay:.09s} main>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* brand */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,#2C74E6 0%,var(--cobalt) 55%,var(--cobalt-d) 100%);box-shadow:0 4px 12px rgba(21,86,192,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.logo svg{width:20px;height:20px}

/* hero band */
.hero{position:relative;overflow:hidden;margin:0 -16px 18px;padding:24px 20px 22px;color:#fff;border-radius:0 0 28px 28px;
  background:linear-gradient(160deg,var(--night3) 0%,var(--night2) 38%,var(--night) 100%);box-shadow:0 12px 30px rgba(12,35,64,.22)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(4px)}
.hero::before{width:260px;height:260px;right:-70px;top:-110px;background:radial-gradient(circle,rgba(242,179,61,.38),rgba(242,179,61,0) 68%)}
.hero::after{width:300px;height:300px;left:-120px;bottom:-190px;background:radial-gradient(circle,rgba(70,140,255,.45),rgba(70,140,255,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .brand{font-size:17px;margin-bottom:18px;opacity:.95}
.hero .brand .logo{width:30px;height:30px;border-radius:9px}
.hero .brand .logo svg{width:17px;height:17px}
.hero h1{font-size:30px;color:#fff}
.hero p.sub{color:rgba(255,255,255,.78);margin-top:6px;font-size:16px;max-width:46ch}
.hero .top{padding:0 0 4px}
.hero .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.pillbar{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:8px 14px;border-radius:99px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:15px;font-weight:600;backdrop-filter:blur(6px)}
.dots{display:inline-flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28)}
.dots i.on{background:var(--maize);box-shadow:0 0 0 3px rgba(242,179,61,.25)}
@media (min-width:680px){ .hero{margin:16px 0 20px;border-radius:28px} }

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 18px;font-weight:600;min-height:48px;
  box-shadow:var(--sh-1);transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.btn:hover:not(:disabled){box-shadow:var(--sh-2)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:var(--sh-1)}
.btn.primary{background:linear-gradient(180deg,#2466D4 0%,var(--cobalt) 100%);border-color:var(--cobalt-d);color:#fff;box-shadow:var(--sh-btn)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#1C5CC8 0%,var(--cobalt-d) 100%)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.block{display:block;width:100%}
.stack{display:grid;gap:10px;margin-top:24px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);box-shadow:var(--sh-1)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));z-index:10;pointer-events:none}
.tabs-in{display:flex;width:100%;max-width:520px;gap:4px;padding:6px;border-radius:22px;pointer-events:auto;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(211,220,230,.8);box-shadow:0 10px 30px rgba(12,35,64,.16)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:16px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;transition:background .15s,color .15s}
.tabs a[aria-current=page]{color:var(--cobalt);background:var(--cobalt-50)}

/* onboarding */
fieldset{border:0;padding:0;margin:0 0 24px}
legend{font-family:var(--display);font-weight:700;font-size:20px;margin-bottom:10px;padding:0}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-1);transition:box-shadow .15s,border-color .15s,transform .12s}
.choice:hover{box-shadow:var(--sh-2)}
.choice b{display:block;font-size:17px}
.choice span.d{color:var(--muted);font-size:15px}
.choice .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt)}
.choice .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:#fff}
.choice .tick svg{width:14px;height:14px;stroke-width:3;opacity:0}
.choice[aria-pressed=true]{border-color:var(--cobalt);background:linear-gradient(180deg,#fff,var(--cobalt-50))}
.choice[aria-pressed=true] .tick{background:var(--cobalt);border-color:var(--cobalt)}
.choice[aria-pressed=true] .tick svg{opacity:1}

/* scenario list */
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:15px;box-shadow:var(--sh-1)}
.counter b{font-family:var(--display)}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh-1);transition:transform .15s ease,box-shadow .15s ease}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.sc:active{transform:translateY(0)}
.sc-ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;align-self:start}
.sc-ico svg{width:26px;height:26px}
.cat-support{background:#E8F0FD;color:#1556C0}
.cat-sales{background:#FFF1D6;color:#9A5B00}
.cat-interview{background:#E5F3EC;color:#146B4A}
.sc-main{display:grid;gap:4px;min-width:0}
.sc-main b{font-size:17px;line-height:1.25}
.sc-main .sum{color:var(--muted);font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:4px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:13px;font-weight:600;background:#EEF2F6;color:var(--ink)}
.chip.fit{background:var(--good-50);color:#0E6B47}
.chip.pro{background:var(--maize-50);color:#7A4E00}
.chip svg{width:13px;height:13px;stroke-width:2.4}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;border-radius:99px;font-weight:700;font-size:12.5px;font-family:var(--body);letter-spacing:.02em}
.lvl-A2{background:#E1F3EA;color:#0E6B47}
.lvl-B1{background:#E4EDFB;color:#0F4299}
.lvl-B2{background:#FBEBC8;color:#7A4E00}
.sc-go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt);transition:background .15s,color .15s}
.sc:hover .sc-go{background:var(--cobalt);color:#fff}
.sc.locked .sc-go{background:var(--maize-50);color:#9A5B00}
.sc.locked .sc-main b{color:#334B63}
.sc-go svg{width:18px;height:18px}
.note{background:var(--maize-50);border:1px solid #F0D592;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.note.err{background:var(--bad-50);border-color:#EBC0C0}
.note.ok{background:var(--good-50);border-color:#A9D8C1}
.note .btn{margin-top:10px;min-height:40px;padding:8px 14px}

/* call */
.call{position:fixed;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  background:radial-gradient(520px 340px at 50% 70px,rgba(46,110,214,.45),rgba(46,110,214,0) 70%),radial-gradient(400px 300px at 50% 105%,rgba(242,179,61,.10),transparent 70%),var(--night)}
.call-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.timer{font-family:var(--body);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1)}
.hang{background:linear-gradient(180deg,#CC4646,var(--bad));border:0;color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;min-height:44px;box-shadow:0 6px 16px rgba(185,58,58,.35)}
.caller{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 0 4px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(150deg,#2A5DAA,var(--night2));display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;
  border:3px solid rgba(255,255,255,.2);box-shadow:0 0 0 8px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .2s}
.avatar.speaking{border-color:var(--maize);animation:talk 1.4s ease-in-out infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 8px rgba(242,179,61,.10),0 10px 30px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 16px rgba(242,179,61,.05),0 10px 30px rgba(0,0,0,.35)}}
.cname{font-family:var(--display);font-weight:700;font-size:22px;margin-top:8px}
.cstatus{font-size:15px;color:rgba(255,255,255,.78);min-height:22px}
.wave{display:flex;gap:5px;height:28px;align-items:center;justify-content:center;margin:6px 0}
.wave span{width:5px;height:8px;border-radius:3px;background:rgba(255,255,255,.3)}
.wave.on span{background:var(--maize);animation:wv 900ms ease-in-out infinite}
.wave.on span:nth-child(2){animation-delay:-.7s}
.wave.on span:nth-child(3){animation-delay:-.4s}
.wave.on span:nth-child(4){animation-delay:-.55s}
.wave.on span:nth-child(5){animation-delay:-.2s}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}
.transcript{flex:1;overflow-y:auto;padding:6px 2px 10px;display:flex;flex-direction:column}
.b{max-width:86%;padding:10px 14px;border-radius:18px;margin:5px 0;font-size:16px;line-height:1.45;overflow-wrap:anywhere;animation:rise .2s ease both}
.b.c{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:6px;align-self:flex-start}
.b.a{background:linear-gradient(180deg,#F6C25C,var(--maize));color:#2A1D00;border-bottom-right-radius:6px;align-self:flex-end;box-shadow:0 4px 14px rgba(242,179,61,.25)}
.b.live{background:rgba(242,179,61,.22);color:#fff;font-style:italic;align-self:flex-end;border-bottom-right-radius:6px}
.call .note{color:var(--ink);margin:6px 0}
#hint .note{margin:4px 0 0}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:10px 0 12px;padding:8px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,#F6C25C,var(--maize));color:#2A1D00;display:grid;place-items:center;position:relative;box-shadow:0 6px 18px rgba(242,179,61,.35)}
.mic:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.mic.on{background:#fff;color:var(--bad)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #fff;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.bar input{min-width:0;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;font-size:16px}
.bar input::placeholder{color:rgba(255,255,255,.55)}
.bar input:disabled{opacity:.5}
.send{height:48px;border-radius:14px;border:0;background:#fff;color:var(--night);font-weight:700;padding:0 16px}
.send:disabled{opacity:.5;cursor:not-allowed}
.skip{background:none;border:0;color:rgba(255,255,255,.75);text-decoration:underline;font-size:14px;padding:4px 8px}
.overlay{position:absolute;inset:0;background:radial-gradient(500px 300px at 50% 40%,rgba(46,110,214,.35),transparent 70%),var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
.overlay p{max-width:36ch;font-size:17px}
.overlay .btn{min-width:200px}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--maize);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* feedback */
.hero .avg{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.avg-n{font-family:var(--body);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.02em}
.avg-of{font-size:16px;color:rgba(255,255,255,.75)}
.hero .summary{color:rgba(255,255,255,.88);font-size:16px;line-height:1.5;max-width:52ch}
.card{background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-1)}
.card b{overflow-wrap:anywhere}
.scores{display:grid;gap:14px}
.score{display:grid;grid-template-columns:150px 1fr 26px;gap:12px;align-items:center;font-size:15px}
.meter{height:8px;border-radius:99px;background:var(--cobalt-100);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
.score b{text-align:right;font-weight:700}
.fix{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--sh-1)}
.fix .row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.fix .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.fix .mk svg{width:15px;height:15px;stroke-width:2.6}
.said .mk{background:var(--bad-50);color:var(--bad)} .better .mk{background:var(--good-50);color:var(--good)}
.fix .lbl{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:1px}
.said q{text-decoration:line-through;text-decoration-color:rgba(185,58,58,.55);text-decoration-thickness:1.5px;color:#5B3030}
.better q{font-weight:600;color:#0E4F36}
q{quotes:none}
.why{display:grid;grid-template-columns:28px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px;color:var(--ink)}
.why .mk{background:var(--maize-50);color:#9A5B00}
.phrase{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-1)}
.phrase b{font-size:17px}
.play{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt);transition:background .15s,color .15s}
.play:hover{background:var(--cobalt);color:#fff}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1)}
.stat .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px}
.stat .si svg{width:17px;height:17px}
.stat b{display:block;font-family:var(--body);font-weight:700;font-size:28px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
.hero .stats{margin-top:18px}
.hero .stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);box-shadow:none;backdrop-filter:blur(6px)}
.hero .stat span{color:rgba(255,255,255,.75)}
.si.flame{background:rgba(242,179,61,.22);color:var(--maize)} .si.trophy{background:rgba(255,255,255,.14);color:#fff} .si.phone{background:rgba(110,165,255,.22);color:#A9C8FF}
.chart{background:var(--card);border-radius:var(--r);padding:14px 12px 8px;box-shadow:var(--sh-1)}
.chart svg{display:block;width:100%;height:auto}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s}
.hist:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.hist .sc-ico{width:42px;height:42px;border-radius:12px;align-self:center}
.hist .sc-ico svg{width:21px;height:21px}
.hist .sc-n{min-width:52px;text-align:center;font-weight:700;font-size:18px;padding:6px 10px;border-radius:12px;background:var(--cobalt-50);color:var(--cobalt-d)}
.empty{background:var(--card);border:1px dashed #B9C6D3;border-radius:var(--r);padding:26px 22px;text-align:center}
.empty .btn{margin-top:14px}

/* settings, pro */
.group{background:var(--card);border-radius:var(--r);box-shadow:var(--sh-1);overflow:hidden;margin-bottom:10px}
.row-set{display:flex;align-items:center;gap:14px;width:100%;background:var(--card);border:0;padding:14px 16px;text-align:left;text-decoration:none;color:inherit}
.group .row-set+.row-set{border-top:1px solid var(--line)}
a.row-set:hover,button.row-set:hover{background:#F8FAFC}
.row-set>span{flex:1;min-width:0}
.row-set>.row-ico{flex:none}
.row-set small{display:block;color:var(--muted);font-size:14px;font-weight:400;overflow-wrap:anywhere}
.row-ico{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--cobalt-50);color:var(--cobalt)}
.row-ico svg{width:19px;height:19px}
.row-ico.gold{background:var(--maize-50);color:#9A5B00}
.row-ico.green{background:var(--good-50);color:var(--good)}
.row-ico.red{background:var(--bad-50);color:var(--bad)}
.chev{color:#9AA9B8;width:18px;height:18px}
input.sw{appearance:none;-webkit-appearance:none;flex:none;width:48px;height:28px;border-radius:99px;background:#B9C6D3;position:relative;cursor:pointer;transition:background .15s}
input.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
input.sw:checked{background:var(--cobalt)}
input.sw:checked::after{transform:translateX(20px)}
.benefits{list-style:none;padding:0;margin:18px 0;display:grid;gap:10px}
.benefits li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:var(--sh-1)}
.benefits li .row-ico{width:34px;height:34px}
.benefits b{display:block;color:var(--ink)}
.benefits span{color:var(--muted);font-size:15px}
.danger{color:var(--bad)}
.pro-hero{background:linear-gradient(150deg,#3A2A05 0%,#5C3F06 30%,var(--night2) 100%)}
.pro-hero::before{background:radial-gradient(circle,rgba(242,179,61,.55),rgba(242,179,61,0) 68%)}
.crown{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:linear-gradient(160deg,#FFD57A,var(--maize));color:#4A3000;margin-bottom:14px;box-shadow:0 8px 20px rgba(242,179,61,.35)}
.crown svg{width:28px;height:28px}

/* sign-in, forms */
.login-hero{padding:30px 22px 64px}
.login-hero h1{font-size:32px;max-width:14ch}
.bubbles{display:grid;gap:8px;margin-top:20px;max-width:300px}
.bubbles span{padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.35;width:fit-content;max-width:100%}
.bubbles .c{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);border-bottom-left-radius:5px}
.bubbles .a{background:var(--maize);color:#2A1D00;border-bottom-right-radius:5px;justify-self:end}
.login-card{position:relative;z-index:2;margin:-48px 0 0;background:var(--card);border-radius:22px;padding:20px 18px;box-shadow:var(--sh-2)}
.field{display:grid;gap:6px;margin-bottom:14px}
.field>label,.field>.lbl{font-weight:600;font-size:15px}
.field small{color:var(--muted);font-size:13px}
.in{width:100%;border:1px solid var(--line-2);border-radius:14px;padding:11px 14px;background:#fff;min-height:48px;transition:border-color .15s,box-shadow .15s}
.in:focus{outline:none;border-color:var(--cobalt);box-shadow:0 0 0 4px rgba(21,86,192,.14)}
textarea.in{min-height:96px;resize:vertical;line-height:1.45}
select.in{appearance:auto}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px;margin:18px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.btn.google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.btn.link{border:0;background:none;box-shadow:none;padding:6px 0;min-height:0;color:var(--cobalt);text-decoration:underline;font-weight:600}
.code-in{font-family:var(--body);font-weight:700;font-size:26px;letter-spacing:.35em;text-align:center}
.pre{white-space:pre-line}

/* admin */
body.wide #app{max-width:980px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 18px;padding:5px;border-radius:16px;background:rgba(255,255,255,.7);box-shadow:var(--sh-1);width:fit-content;max-width:100%}
.seg a{padding:8px 16px;border-radius:12px;text-decoration:none;font-weight:600;font-size:15px;color:var(--muted)}
.seg a[aria-current=page]{background:var(--cobalt);color:#fff;box-shadow:var(--sh-btn)}
.admin-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:22px 0 16px}
.admin-top .brand{flex:1}
.admin-top .btn{min-height:40px;padding:8px 14px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:13px;font-weight:600;background:#E9EEF3;color:var(--ink)}
.pill.pro{background:#FBEBC8;color:#7A4E00}
.pill.off{background:#F3E1E1;color:#8A2E2E}
.row-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
.row-actions .btn{min-height:40px;padding:8px 14px}
.row-actions .in{width:auto;min-height:40px;padding:6px 10px}
.search{display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px}
.tbl-wrap{overflow-x:auto;background:var(--card);border-radius:var(--r);box-shadow:var(--sh-1)}
.tbl{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:10px 14px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-weight:600;color:var(--muted);font-size:13.5px;background:#F8FAFC}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr:hover td{background:#F8FAFC}
.stats.four{grid-template-columns:repeat(4,1fr)}
.stats.four .stat .si{background:var(--cobalt-50);color:var(--cobalt)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.sc-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.sc-row .sc-ico{width:42px;height:42px;border-radius:12px}
.sc-row .sc-ico svg{width:21px;height:21px}

/* call-center pivot */
.cat-service{background:#E8F0FD;color:#1556C0}
.cat-tech{background:#EEE9FB;color:#5B3FB8}
.cat-collections{background:#FDECEA;color:#A33A2E}
.temper{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:99px;font-size:12.5px;font-weight:700;background:#EEF2F6;color:var(--ink)}
.temper i{width:8px;height:8px;border-radius:50%;background:currentColor}
.temper-calm{background:#E4F4EC;color:#0E6B47}
.temper-demanding{background:#FFF1D6;color:#8A5300}
.temper-furious{background:#FBE5E5;color:#A12F2F}
.filters{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 14px;padding:2px 16px 6px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.filters a{flex:none;padding:8px 14px;border-radius:99px;background:var(--card);box-shadow:var(--sh-1);text-decoration:none;font-weight:600;font-size:14.5px;color:var(--muted)}
.filters a[aria-current=page]{background:var(--night);color:#fff}

/* call layout: conversation + agent desk */
.call{display:grid;grid-template-columns:1fr;max-width:1180px;padding:0}
.call-main{position:relative;display:flex;flex-direction:column;min-height:0;height:100%;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);max-width:680px;width:100%;margin:0 auto}
.call-top{gap:10px}
.desk-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.1);color:#fff;border-radius:12px;padding:8px 12px;font-weight:600;min-height:44px}
.desk-btn svg{width:18px;height:18px}
.cmeta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px;font-size:14px;color:rgba(255,255,255,.75)}
.cmeta .temper{height:22px}
.answer{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border:0;border-radius:16px;font-weight:700;font-size:17px;color:#fff;
  background:linear-gradient(180deg,#22A36E,#17835A);box-shadow:0 8px 22px rgba(23,131,90,.4);animation:ringme 1.6s ease-in-out infinite}
.answer svg{width:22px;height:22px}
@keyframes ringme{0%,100%{box-shadow:0 8px 22px rgba(23,131,90,.4),0 0 0 0 rgba(34,163,110,.55)}50%{box-shadow:0 8px 22px rgba(23,131,90,.4),0 0 0 12px rgba(34,163,110,0)}}
.desk{display:none;color:var(--ink);background:var(--card);overflow-y:auto}
.desk.open{display:block;position:fixed;left:0;right:0;bottom:0;max-height:78vh;z-index:30;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.35)}
.desk-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.desk-head span{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:18px}
.desk-head svg{width:20px;height:20px;color:var(--cobalt)}
.desk-close{width:40px;height:40px;border-radius:12px;border:1px solid var(--line-2);background:#fff;display:grid;place-items:center}
.desk-close svg{width:18px;height:18px}
.desk-co{color:var(--muted);font-size:14px;margin:2px 0 12px}
.acct{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;margin:0 0 16px;padding:12px 14px;border-radius:14px;background:#F6F8FB;font-size:14.5px}
.acct dt{color:var(--muted);font-weight:600}
.acct dd{margin:0;overflow-wrap:anywhere}
.desk h3{font-family:var(--display);font-size:16px;margin:0 0 8px}
.pol{margin:0;padding-left:20px;display:grid;gap:8px;font-size:14.5px;line-height:1.45}
@media (min-width:900px){
  .call{grid-template-columns:minmax(0,1fr) 380px;left:0;right:0;margin:0 auto}
  .desk{display:block;position:static;border-radius:0;padding:24px 22px;box-shadow:-10px 0 30px rgba(0,0,0,.25)}
  .desk.open{position:static;max-height:none;box-shadow:-10px 0 30px rgba(0,0,0,.25);border-radius:0;padding:24px 22px}
  .desk-btn,.desk-close{display:none}
}

/* results */
.scorecard{padding:6px 6px}
details.crit{border-bottom:1px solid var(--line)}
details.crit:last-child{border-bottom:0}
details.crit summary{display:grid;grid-template-columns:150px 1fr 26px 18px;gap:12px;align-items:center;padding:12px 10px;cursor:pointer;list-style:none;border-radius:12px}
details.crit summary::-webkit-details-marker{display:none}
details.crit summary:hover{background:#F8FAFC}
.crit-name{font-weight:600;font-size:15px}
.crit-name small{display:block;color:var(--muted);font-weight:400;font-size:12.5px}
details.crit summary b{text-align:right}
.chev-d svg{width:16px;height:16px;color:#9AA9B8;transition:transform .15s}
details.crit[open] .chev-d svg{transform:rotate(90deg)}
.crit-body{padding:0 10px 14px;display:grid;gap:8px}
.crit-body .ev{color:var(--muted);font-style:italic;border-left:3px solid var(--line-2);padding-left:10px}
.crit-body .tip{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start}
.crit-body .tip .mk,.strengths .mk{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--maize-50);color:#9A5B00}
.crit-body .tip .mk svg,.strengths .mk svg{width:14px;height:14px;stroke-width:2.4}
.strengths{list-style:none;margin:0;display:grid;gap:10px}
.strengths li{display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.strengths .mk.ok{background:var(--good-50);color:var(--good)}
details.review summary{cursor:pointer;list-style:none;display:grid;gap:2px}
details.review summary::-webkit-details-marker{display:none}
details.review summary h2::after{content:" ▸";color:var(--muted);font-size:15px}
details.review[open] summary h2::after{content:" ▾"}
.tlist{display:grid;gap:10px;margin-top:14px}
.tl{display:grid;grid-template-columns:52px 1fr;gap:10px;font-size:15px}
.tl .who{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.tl.ag .who{color:var(--cobalt)}
.tl mark{background:#FFE7A6;border-radius:4px;padding:0 2px}
#f-acct,#f-pol,#f-facts{min-height:170px}
.note .btn.link{margin:0;min-height:0;padding:0}
.score.weak span:first-child{font-weight:700}
.score.weak .meter i{background:var(--maize)}
.score.weak .meter{background:var(--maize-50)}
@media (max-width:420px){ details.crit summary{grid-template-columns:112px 1fr 24px 16px;gap:8px} }

/* ---------- responsive layout: phone first; tablet from 720px; desktop from 1024px ---------- */
.side{display:none}
.frame>main{min-width:0}
.cards{display:grid;grid-template-columns:1fr;gap:0 16px}
.cols{display:grid;grid-template-columns:1fr;gap:0 28px;align-items:start}
.choices{display:grid;grid-template-columns:1fr;gap:0 12px}

@media (min-width:720px){
  #app{max-width:900px;padding-left:24px;padding-right:24px}
  .hero{margin:20px 0 22px;border-radius:28px;padding:28px 28px 26px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cards .sc{height:calc(100% - 12px)}
  .cards .sc{align-items:start}
  .cards .sc-go{align-self:center}
  .chart svg{max-height:280px}
  .choices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .choices .choice{height:calc(100% - 10px)}
  .benefits{grid-template-columns:repeat(3,minmax(0,1fr))}
  .benefits li{grid-template-columns:1fr;align-content:start}
  .filters{margin-left:0;margin-right:0;padding-left:0;padding-right:0;flex-wrap:wrap;overflow:visible}
  .stats{gap:14px}
  main.solo{max-width:820px;margin:0 auto}
}

@media (min-width:1024px){
  #app{max-width:none;padding:0}
  .frame{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
  .frame>main{padding:28px 40px 56px;max-width:1240px;width:100%}
  .frame.narrow>main{max-width:820px}
  body.wide #app{max-width:none;padding:0}
  .tabs{display:none}
  .side{display:flex;flex-direction:column;gap:8px;position:sticky;top:0;height:100vh;padding:26px 18px;background:rgba(255,255,255,.75);
    backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-right:1px solid var(--line)}
  .side .brand{padding:0 10px 18px}
  .side-nav{display:grid;gap:4px}
  .side-nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;text-decoration:none;font-weight:600;color:var(--muted);transition:background .15s,color .15s}
  .side-nav a:hover{background:#EEF2F7;color:var(--ink)}
  .side-nav a[aria-current=page]{background:var(--cobalt-50);color:var(--cobalt)}
  .side-plan{margin-top:auto;display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:var(--maize-50);color:#7A4E00;text-decoration:none;font-weight:600;font-size:14px}
  .side-plan svg{width:18px;height:18px}
  .side-user{font-size:13px;color:var(--muted);padding:0 12px;overflow-wrap:anywhere}
  .hero{margin:0 0 24px;padding:32px 36px 30px}
  .hero h1{font-size:36px}
  .hero .brand{display:none}
  .frame .hero .brand{display:none}
  .cards{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
  .cols{grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr)}
  .choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  main.solo{max-width:960px;padding:24px 0 48px}
  main.solo .hero .brand{display:flex}
  .score{grid-template-columns:170px 1fr 30px}

  /* sign-in: welcome on the left, form on the right */
  main.login-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(360px,.85fr);grid-template-rows:1fr auto auto 1fr;gap:0 48px;
    max-width:1180px;min-height:100vh;margin:0 auto;padding:32px 40px;align-items:center}
  main.login-grid .login-hero{grid-row:1 / -1;grid-column:1;align-self:stretch;display:flex;flex-direction:column;justify-content:center;margin:0;padding:48px 48px 56px}
  main.login-grid .login-hero .brand{display:flex}
  main.login-grid .login-hero h1{font-size:46px;max-width:13ch}
  main.login-grid .login-hero .bubbles{max-width:420px}
  main.login-grid .login-card{margin:0;grid-column:2;grid-row:2;padding:28px 26px}
  main.login-grid>p{grid-column:2;grid-row:3;text-align:left!important}
}

@media (min-width:1440px){
  .frame{grid-template-columns:280px minmax(0,1fr)}
  .frame>main{padding:32px 56px 64px}
}

/* admin dashboard */
.side-label{margin:14px 0 4px;padding:0 12px;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8A99A8}
.side-out{display:flex;align-items:center;gap:12px;margin-top:auto;padding:11px 12px;border:0;border-radius:12px;background:none;color:var(--muted);font-weight:600;text-align:left}
.side-out:hover{background:#F6EAEA;color:var(--bad)}
.stats.kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stats.kpis .stat .si{background:var(--cobalt-50);color:var(--cobalt)}
.stats.kpis .stat small{display:block;margin-top:2px;font-size:13px;color:var(--good);font-weight:600}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.block-head h2{margin:0}
.block-head .btn.link{font-size:14px}
.card.list{padding:6px 8px}
.aib{display:grid;gap:16px}
.aib-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.aib-top span{font-variant-numeric:tabular-nums;white-space:nowrap}
.aib .meter{display:block;margin:7px 0 5px}
.aib small{display:block}
.aib .meter.near i{background:var(--maize)}
.aib .meter.full i{background:var(--bad)}
@media (min-width:720px){ .aib{grid-template-columns:repeat(3,minmax(0,1fr));gap:22px} }
.act{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 8px;border-bottom:1px solid var(--line)}
.act:last-child{border-bottom:0}
.act .sc-ico{width:40px;height:40px;border-radius:12px;align-self:center}
.act .sc-ico svg{width:20px;height:20px}
.act-main{display:grid;min-width:0}
.act-main b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act-main .small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.act .sc-n{min-width:46px;text-align:center;font-weight:700;padding:5px 9px;border-radius:11px;background:var(--cobalt-50);color:var(--cobalt-d)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:linear-gradient(150deg,#2A5DAA,var(--night2));color:#fff}
.frame.admin .hero .brand{display:none}
.frame.admin .seg{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.frame.admin .seg::-webkit-scrollbar{display:none}
.frame.admin .seg a{flex:none}
@media (max-width:719px){ .stats.kpis .stat:last-child:nth-child(odd){grid-column:1/-1} }
@media (min-width:720px){ .stats.kpis{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (min-width:1024px){
  .frame.admin .admin-top,.frame.admin .seg{display:none}
  .stats.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}
  .frame.admin .side{gap:4px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .wave.on span{height:18px}
  .mic.on::after{opacity:.6}
}
@media (max-width:380px){ .score{grid-template-columns:116px 1fr 24px} h1{font-size:25px} .hero h1{font-size:27px} }
@media (max-width:560px){ .grid2{grid-template-columns:1fr} .stats.four{grid-template-columns:repeat(2,1fr)} }

/* Dark mode (admin preview): the same layout with dark surfaces. The call screen is dark already. */
html[data-theme=dark]{
  color-scheme:dark;
  --paper:#0B1622; --card:#14222F; --ink:#E4EBF2; --muted:#9AABBC; --line:#24364A; --line-2:#2F4560;

<script>
/* LOGIC:START — pure functions, unit-tested from server/src/__tests__/web-logic.test.ts */
const CALL_TYPES = ['service', 'tech', 'sales', 'collections', 'interview'];
const TEMPERS = ['calm', 'demanding', 'furious'];

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function dayNumber(key) {
  const p = key.split('-').map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}

// dateKeys: local 'YYYY-MM-DD' strings with at least one call. today: Date.
// The current streak stays alive if the last practice day was today or yesterday.
function computeStreak(dateKeys, today) {
  const days = Array.from(new Set(dateKeys)).map(dayNumber).sort(function (a, b) { return a - b; });
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    run = prev !== null && d === prev + 1 ? run + 1 : 1;
    if (run > best) best = run;
    prev = d;
  }
  const todayN = dayNumber(dateKey(today));
  const last = days.length ? days[days.length - 1] : null;
  let current = 0;
  if (last !== null && (last === todayN || last === todayN - 1)) {
    current = 1;
    let i = days.length - 1;
    while (i > 0 && days[i - 1] === days[i] - 1) { current++; i--; }
  }
  return { current: current, best: best };
}

// Mirrors the server's rule so the page can explain a refusal before trying. The server has the final word.
// Free: `limit` calls per day, free-tier scenarios only. Pro: no limits.
function canStartCall(o) {
  if (o.isPro) return { ok: true, reason: null };
  if (o.scenario.tier === 'pro') return { ok: false, reason: 'pro_required' };
  if (o.startsToday >= o.limit) return { ok: false, reason: 'daily_limit' };
  return { ok: true, reason: null };
}

// The learner's call types first, calm before furious inside each group. Interviews go first for job seekers,
// last for everyone else. Stable otherwise.
function sortScenarios(list, profile) {
  const interests = (profile && profile.interests) || [];
  const seeker = !!profile && profile.role === 'job_seeker';
  return list
    .map(function (s, i) {
      let k;
      if (s.callType === 'interview') k = seeker ? -1 : 30;
      else k = (interests.length && interests.indexOf(s.callType) < 0 ? 10 : 0) + TEMPERS.indexOf(s.temperament);
      return { s: s, i: i, k: k };
    })
    .sort(function (a, b) { return a.k - b.k || a.i - b.i; })
    .map(function (x) { return x.s; });
}

function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function trendPoints(calls, n) {
  return calls.slice()
    .sort(function (a, b) { return a.startedAt < b.startedAt ? -1 : a.startedAt > b.startedAt ? 1 : 0; })
    .slice(-(n || 20))
    .map(function (c) { return c.qaScore; });
}

// A QA score in words, the way a quality team would sum it up.
function verdict(score) {
  if (score >= 85) return 'Ready for live calls';
  if (score >= 70) return 'Solid call';
  if (score >= 50) return 'Needs coaching';
  return 'Keep practicing';
}

function freeUsedText(limit) {
  if (limit <= 0) return 'There are no free calls available today.';
  if (limit === 1) return 'You have used your free call for today.';
  return 'You have used your ' + limit + ' free calls for today.';
}

// Split `text` into pieces, marking the parts that match any of `quotes` (case-insensitive). Used to highlight
// coaching moments inside the transcript.
function markQuotes(text, quotes) {
  const lower = text.toLowerCase();
  const hits = [];
  (quotes || []).forEach(function (q) {
    const needle = String(q || '').trim().replace(/^["“'‘]+|["”'’.,;:!?]+$/g, '').trim().toLowerCase();
    if (needle.length < 4) return;
    const at = lower.indexOf(needle);
    if (at >= 0) hits.push([at, at + needle.length]);
  });
  hits.sort(function (a, b) { return a[0] - b[0]; });
  const out = [];
  let pos = 0;
  hits.forEach(function (h) {
    if (h[0] < pos) return; // overlapping quote; keep the first
    if (h[0] > pos) out.push({ text: text.slice(pos, h[0]), hit: false });
    out.push({ text: text.slice(h[0], h[1]), hit: true });
    pos = h[1];
  });
  if (pos < text.length) out.push({ text: text.slice(pos), hit: false });
  return out;
}
// The server says another request is still working on this call: wait and try once more on our own (never twice,
// so a stuck call ends with a button instead of a loop). Returns the wait in ms, or null for "don't retry".
function turnRetryDelay(code, retryAfter, alreadyRetried) {
  if (code !== 'turn_in_progress' || alreadyRetried) return null;
  const sec = Number(retryAfter);
  return Math.min(5, Math.max(1, Number.isFinite(sec) && sec > 0 ? sec : 3)) * 1000;
}
// Errors after which the call can't take more turns (out of sync with the server, or already over).
function callCantContinue(code) {
  return code === 'turn_conflict' || code === 'call_over';
}
// The mic, text box and Send are off while a reply is on its way or playing, after the call ended, and once the call
// can't continue (until the agent ends it or leaves).
function inputBlocked(s) {
  return !!(s.busy || s.speaking || s.ended || s.cantContinue);
}
// "just now", "5 min ago", "3 h ago", "2 days ago", then a date.
function timeAgo(iso, now) {
  const s = Math.max(0, Math.round((now.getTime() - new Date(iso).getTime()) / 1000));
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + ' min ago';
  if (s < 86400) return Math.floor(s / 3600) + ' h ago';
  const d = Math.floor(s / 86400);
  if (d < 7) return d === 1 ? '1 day ago' : d + ' days ago';
  return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}
/* LOGIC:END */

  set(k, v) { try { localStorage.setItem('callready.' + k, JSON.stringify(v)); } catch { /* storage full or blocked */ } },
};
const autoSend = () => store.get('autoSend', true) !== false;
/** Dark mode is an admin preview for now. Before /me answers, the device's saved choice avoids a light flash;

function applyTheme() {

  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}
const darkSwitch = () => '<label class="row-set"><span class="row-ico" aria-hidden="true">' + I.moon + '</span><span>Dark mode<small>Admin preview: only admins can see this for now.</small></span>' +
  '<input class="sw" type="checkbox" id="dark" role="switch"' + (store.get('dark', false) === true ? ' checked' : '') + '></label>';

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0'));
  return [h.slice(0, 4).join(''), h.slice(4, 6).join(''), h.slice(6, 8).join(''), h.slice(8, 10).join(''), h.slice(10).join('')].join('-');
}

async function api(path, body, method) {

    e.code = (data && data.error && data.error.code) || 'unknown';

    if (res.status === 401 && sb) { me = null; sb.auth.signOut().catch(() => {}); }
    throw e;
  }
  return data;
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const v = speechSynthesis.getVoices();
  return v.find((x) => x.lang === 'en-US' && /google|natural|samantha|aria/i.test(x.name)) ||
    v.find((x) => x.lang === 'en-US') || v.find((x) => /^en/i.test(x.lang)) || null;
}
function speak(text, rate) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
    // Some Chrome versions never fire onend on long text; fall back to an estimate.
    const timer = setTimeout(finish, 4000 + text.length * 95);
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = rate || 1;
      const v = pickVoice(); if (v) u.voice = v;
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
    } catch { finish(); }
  });
}
function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch { /* ignore */ } }

let cleanup = () => {};

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('?');
  const seg = parts[0].split('/').map((x) => decodeURIComponent(x));
  return { name: seg[0] || '', arg: seg[1] || '', arg2: seg[2] || '', q: new URLSearchParams(parts[1] || '') };
}

async function render() {
  cleanup(); cleanup = () => {};
  const vid = ++viewId;

  window.scrollTo(0, 0);

  document.body.classList.toggle('wide', r.name === 'admin');

  if (!session) {
    if (r.name !== 'login') { location.hash = '#/login'; return; }
    return loginView(vid);
  }
  if (r.name === 'login') { location.hash = '#/'; return; }
  if (!me) {

  if (!r.name && me.isAdmin) { location.hash = '#/admin'; return; }

  if (/expired|invalid|otp|token/.test(msg)) return 'That code is not right or has expired. Check the email or ask for a new one.';

    const tr = el('#tr'); if (!tr) return null;
    const d = document.createElement('div');
    d.className = 'b ' + kind; d.textContent = text;
    tr.appendChild(d); tr.scrollTop = tr.scrollHeight;
    return d;
  }
  function showNotice(msg, actions, isError) {
    const n = el('#notice'); if (!n) return;
    n.hidden = false;
    n.innerHTML = '<div class="note' + (isError ? ' err' : '') + '" role="alert">' + esc(msg) +
      (actions || []).map((a, i) => '<br><button class="btn" data-act="' + i + '">' + esc(a.label) + '</button>').join('') + '</div>';
    (actions || []).forEach((a, i) => n.querySelector('[data-act="' + i + '"]').addEventListener('click', () => { hideNotice(); a.fn(); }));
  }
  function hideNotice() { const n = el('#notice'); if (n) { n.hidden = true; n.innerHTML = ''; } }

  function hint() {
    const msg = !SR ? 'This browser has no speech recognition. Use Chrome or Edge, or type your replies below.'
      : !secure ? 'The microphone only works on a secure page (HTTPS or localhost). Type your replies below for now.' : '';
    const h = el('#hint');
    if (h && msg) h.innerHTML = '<div class="note small">' + esc(msg) + '</div>';
  }

  function answer() {
    state.answered = true; state.startTs = Date.now();
    timer = setInterval(() => { const t = el('#timer'); if (t) t.textContent = formatTime((Date.now() - state.startTs) / 1000); }, 1000);
    el('#bar').innerHTML = '<button class="mic" id="mic" aria-label="Talk" title="Talk">' + I.mic + '</button>' +
      '<input id="txt" type="text" maxlength="500" autocomplete="off" autocapitalize="sentences" placeholder="Type your reply" aria-label="Your reply">' +
      '<button class="send" id="send">Send</button>';
    el('#mic').addEventListener('click', () => { if (state.listening) stopMic(); else startMic(); });
    el('#send').addEventListener('click', () => sendAgent(el('#txt').value));
    el('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendAgent(el('#txt').value); } });
    setStatus('You\'re on the line. Greet the caller.');
    const h = el('#hint'); if (h && !h.innerHTML) h.innerHTML = '<div class="note small">' + esc(greetHint) + '</div>';
    hint(); updateUi();
    el('#txt').focus({ preventScroll: true });
  }

  const leave = () => { cleanup(); location.hash = '#/scenarios'; };
  const pause = (ms) => new Promise((r) => setTimeout(r, ms));

  async function requestTurn(retried) {
    state.busy = true; updateUi(); hideNotice();
    setStatus(who + ' is replying…');
    try {
      const data = await api('/session/turn', { sessionId: sessionId, scenarioId: sc.id, history: state.history });
      if (state.ended) return;
      state.history.push({ role: 'customer', text: data.line });
      if (!state.started) { state.started = true; me.callsToday++; }
      addBubble('c', data.line);
      state.busy = false; state.speaking = true; updateUi();
      setStatus(who + ' is talking…', 'speaking');
      const skip = document.createElement('button');
      skip.className = 'skip'; skip.textContent = 'Skip audio';
      skip.addEventListener('click', stopSpeech);
      const st = el('.cstatus'); if (st) st.appendChild(skip);
      await speak(data.line, rate);
      skip.remove();
      state.speaking = false;
      if (state.ended) return;
      if (data.callEnded) { await finishCall(); return; }
      setStatus('Your turn. Tap the mic or type.');
      const t = el('#txt'); if (t && !state.busy) { updateUi(); t.focus({ preventScroll: true }); }
    } catch (e) {
      if (state.ended) return;
      const wait = turnRetryDelay(e.code, e.retryAfter, retried === true);
      if (wait !== null) {
        // The server is still on this same reply (e.g. a retried request): resending the same line gets it, once.
        await pause(wait);
        if (state.ended) return;
        return await requestTurn(true);
      }
      state.busy = false; state.speaking = false;
      if (e.code === 'pro_required' || e.code === 'daily_limit') { cleanup(); location.hash = '#/pro?why=' + e.code; return; }
      if (e.code === 'unauthorized') { cleanup(); return; }
      if (e.code === 'session_token_cap' && agentTurns() >= 3) { showNotice(errMsg(e)); await finishCall(); return; }
      if (callCantContinue(e.code)) {
        // No more turns from here: only ending the call (for a score) or leaving resolves it.
        state.cantContinue = true;
        setStatus('The call can\'t continue');
        showNotice(errMsg(e), agentTurns() >= 3
          ? [{ label: 'End call and get your score', fn: finishCall }, { label: 'Leave without a score', fn: leave }]
          : [{ label: 'Leave the call', fn: leave }], true);
        return;
      }
      setStatus('Connection problem');
      // A failed reply leaves the agent's last line in place, so "Try again" resends it.
      showNotice(errMsg(e), [{ label: 'Try again', fn: () => requestTurn() }], true);
    } finally {
      if (!state.ended) { state.busy = false; updateUi(); }
    }
  }

  async function sendAgent(raw) {
    const text = String(raw || '').trim().slice(0, 500);
    if (!text || inputBlocked(state)) return;
    if (!state.history.length) { const h = el('#hint'); if (h) h.innerHTML = ''; hint(); }
    state.history.push({ role: 'agent', text: text });
    addBubble('a', text);
    const t = el('#txt'); if (t) t.value = '';
    await requestTurn();
  }

  const MIC_ERR = {
    'not-allowed': 'The browser is not allowed to use the microphone. Allow it from the padlock in the address bar, or type your reply.',
    'service-not-allowed': 'The browser is not allowed to use the microphone. Allow it from the padlock in the address bar, or type your reply.',
    'no-speech': 'We didn\'t hear anything. Try again or type your reply.',
    'audio-capture': 'No microphone was found.',
    'network': 'Speech recognition needs internet. Type your reply for now.',
    'language-not-supported': 'This browser cannot recognize English speech. Type your reply.',
  };

  function startMic() {
    if (!SR || !secure || inputBlocked(state)) return;
    hideNotice();
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    let finalText = '', lastErr = null, live = null;
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) finalText += res[0].transcript + ' '; else interim += res[0].transcript;
      }
      const shown = (finalText + interim).trim();
      if (!live) live = addBubble('live', shown); else { live.textContent = shown; const tr = el('#tr'); if (tr) tr.scrollTop = tr.scrollHeight; }
    };
    r.onerror = (e) => { lastErr = e.error; };
    r.onend = () => {
      state.listening = false; state.rec = null;
      if (live) live.remove();
      if (state.ended) return;
      setStatus('Your turn. Tap the mic or type.'); updateUi();
      const text = finalText.trim();
      if (text) {
        if (autoSend()) sendAgent(text); else { const t = el('#txt'); t.value = text; t.focus(); }
      } else if (lastErr && lastErr !== 'aborted') {
        showNotice(MIC_ERR[lastErr] || 'The microphone could not be used. Type your reply.');
      } else if (!lastErr) {
        showNotice(MIC_ERR['no-speech']);
      }
    };
    try { r.start(); } catch { showNotice('The microphone could not start. Type your reply.'); return; }
    state.rec = r; state.listening = true; updateUi(); setStatus('Listening… speak now', 'listening');
  }
  function stopMic() { try { if (state.rec) state.rec.stop(); } catch { /* ignore */ } }

  function overlay(html, actions) {
    const c = el('.call-main'); if (!c) return;
    let o = el('.overlay'); if (!o) { o = document.createElement('div'); o.className = 'overlay'; c.appendChild(o); }
    o.innerHTML = html;
    (actions || []).forEach((a, i) => { const b = document.createElement('button'); b.className = 'btn' + (i === 0 ? ' primary' : ''); b.textContent = a.label; b.addEventListener('click', a.fn); o.appendChild(b); });
  }

  async function finishCall() {
    state.ended = true; clearInterval(timer); stopSpeech(); stopMic();
    if (agentTurns() < 3) { location.hash = '#/scenarios'; return; }
    await generateFeedback();
  }
  async function generateFeedback(retried) {
    overlay('<div class="spinner" aria-hidden="true"></div><p>Scoring your call…</p>');
    try {
      // The server scores its own record of the call, so the page's copy isn't sent.
      const fb = await api('/session/feedback', { sessionId: sessionId, scenarioId: sc.id });
      callCache[fb.callId] = {
        id: fb.callId, scenarioId: sc.id, title: sc.title, callType: sc.callType, temperament: sc.temperament,
        startedAt: new Date(state.startTs).toISOString(), durationSec: Math.round((Date.now() - state.startTs) / 1000),
        // Show exactly what was scored: the server's transcript, not this page's copy.
        qaScore: fb.qaScore, feedback: fb, transcript: fb.transcript,
      };
      location.hash = '#/results/' + fb.callId;
    } catch (e) {
      const wait = turnRetryDelay(e.code, e.retryAfter, retried === true);
      if (wait !== null) { await pause(wait); return generateFeedback(true); }
      const actions = e.code === 'not_enough_speech' || e.code === 'session_token_cap' || e.code === 'not_found' || e.code === 'call_over'
        ? [{ label: 'Back to calls', fn: () => { location.hash = '#/scenarios'; } }]
        : [{ label: 'Try again', fn: () => generateFeedback() }, { label: 'Leave without saving', fn: () => { location.hash = '#/scenarios'; } }];
      overlay('<p>' + esc(errMsg(e)) + '</p>', actions);
    }
  }

  el('#answer').addEventListener('click', answer);
  el('#hang').addEventListener('click', () => {
    if (state.ended) return;
    if (!state.answered) { cleanup(); location.hash = '#/scenarios'; return; }
    if (agentTurns() < 3) {
      if (confirm('This call is too short to score. Leave the call?')) { cleanup(); location.hash = '#/scenarios'; }
      return;
    }
    if (confirm('Hang up and see your scorecard?')) finishCall();
  });

  setStatus('Incoming call…');
}

/* ---------- progress ---------- */
function trendSvg(vals) {
  const W = 320, H = 150, px = 30, py = 22, n = vals.length;
  const x = (i) => (n === 1 ? W / 2 : px + i * (W - 2 * px) / (n - 1));
  const y = (v) => H - py - v / 100 * (H - 2 * py);
  const grid = [0, 50, 100].map((g) => '<line x1="' + px + '" x2="' + (W - 8) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#E1E7EE" stroke-width="1"/><text x="' + (px - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="11" fill="#5A6B7D">' + g + '</text>').join('');
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = n > 1 ? '<polygon points="' + x(0) + ',' + y(0) + ' ' + pts + ' ' + x(n - 1) + ',' + y(0) + '" fill="url(#tg)"/>' : '';
  // Visible dot with a surface ring, plus a larger invisible hit area that carries the hover label.
  const dots = vals.map((v, i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="#1556C0" stroke="#fff" stroke-width="2"/>' +
    '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="13" fill="transparent"><title>Call ' + (i + 1) + ': ' + v + ' / 100</title></circle>').join('');
  const last = vals[n - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="QA score per call. Latest: ' + last + ' out of 100.">' +
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1556C0" stop-opacity=".18"/><stop offset="1" stop-color="#1556C0" stop-opacity="0"/></linearGradient></defs>' + grid + area +
    (n > 1 ? '<polyline points="' + pts + '" fill="none" stroke="#1556C0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' : '') + dots +
    '<text x="' + Math.min(x(n - 1), W - 16) + '" y="' + (y(last) - 10) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#0F2438">' + last + '</text></svg>';
}

const progressHero = (extra) => '<section class="hero">' + brandMark() + '<h1>Your progress</h1>' + (extra || '') + '</section>';

async function progressView(vid) {
  root().innerHTML = shell(progressHero() + '<p class="muted" id="loading">Loading…</p>', 'progress');
  let data;
  try { data = await api('/calls'); } catch (e) {
    if (vid !== viewId) return;
    root().innerHTML = shell(progressHero() + '<div class="note err">' + esc(errMsg(e)) + '<br><button class="btn" id="retry">Try again</button></div>', 'progress');
    $('#retry').addEventListener('click', () => progressView(vid));
    return;
  }
  if (vid !== viewId) return;
  const calls = data.calls, skills = data.skills || [];
  const keys = calls.map((c) => dateKey(new Date(c.startedAt)));
  const streak = computeStreak(keys, new Date());
  const unit = (n) => (n === 1 ? 'day' : 'days');
  let body;
  if (!calls.length) {
    body = '<div class="empty"><p><b>No calls yet.</b></p><p class="muted">Your scores, skills and streak show up here after your first call.</p><a class="btn primary" href="#/scenarios" style="display:inline-block;text-decoration:none">Take a call</a></div>';
  } else {
    const pts = trendPoints(calls, 20);
    const weakest = skills.length ? skills.reduce((a, b) => (b.avg < a.avg ? b : a)) : null;
    const skillRows = skills.map((s) => '<div class="score' + (weakest && s.key === weakest.key && skills.length > 1 ? ' weak' : '') + '"><span>' + esc(s.label) + '</span>' +
      '<span class="meter" role="img" aria-label="' + esc(s.label) + ': average ' + s.avg + ' of 10"><i style="width:' + s.avg * 10 + '%"></i></span><b>' + s.avg.toFixed(1) + '</b></div>').join('');
    const hist = calls.map((c) =>
      '<a class="hist" href="#/results/' + encodeURIComponent(c.id) + '" style="color:inherit;text-decoration:none">' + catIcon(c.callType) +
      '<span><b>' + esc(c.title) + '</b><br><span class="muted small">' +
      fmtDate(c.startedAt) + ' · ' + formatTime(c.durationSec) + ' · ' + TEMPER_NAMES[c.temperament] + '</span></span>' +
      '<span class="sc-n" aria-label="QA score ' + c.qaScore + ' out of 100">' + c.qaScore + '</span></a>').join('');
    body = '<div class="cols"><div><section class="block"><h2>QA score per call</h2><div class="chart">' + trendSvg(pts) + '</div>' +
      (pts.length < 2 ? '<p class="muted small" style="margin-top:8px">Take another call to see your trend.</p>' : '') + '</section>' +
      (skills.length ? '<section class="block"><h2>Your skills</h2><p class="section-sub">Average score per scorecard item' + (weakest && skills.length > 1 ? '. Focus next on <b>' + esc(weakest.label) + '</b>.' : '.') + '</p><div class="card scores">' + skillRows + '</div></section>' : '') +
      '</div><div><section class="block"><h2>History</h2>' + hist + '</section></div></div>';
  }
  const avg = calls.length ? Math.round(calls.reduce((a, c) => a + c.qaScore, 0) / calls.length) : 0;
  const stats = '<div class="stats">' +
    '<div class="stat"><span class="si flame" aria-hidden="true">' + I.flame + '</span><b>' + streak.current + '</b><span>Current streak (' + unit(streak.current) + ')</span></div>' +
    '<div class="stat"><span class="si trophy" aria-hidden="true">' + I.trophy + '</span><b>' + (calls.length ? avg : '—') + '</b><span>Average QA</span></div>' +
    '<div class="stat"><span class="si phone" aria-hidden="true">' + I.phone + '</span><b>' + calls.length + '</b><span>Calls</span></div></div>';
  root().innerHTML = shell(progressHero(stats) + body, 'progress');
}

// Calls per day as columns, oldest on the left. One series, so no legend; values in the hover label and the table on Usage.
function callsColumns(days) {
  const n = days.length, W = n <= 7 ? 360 : 640, H = n <= 7 ? 190 : 210, pl = 30, pr = 6, pt = 22, pb = 30;
  const max = Math.max(4, ...days.map((d) => d.calls));
  const step = max <= 10 ? 2 : max <= 50 ? 10 : Math.ceil(max / 5 / 10) * 10;
  const top = Math.ceil(max / step) * step;
  const y = (v) => H - pb - v / top * (H - pt - pb);
  const slot = (W - pl - pr) / n, bw = Math.min(26, slot * 0.62);
  const grid = Array.from({ length: Math.floor(top / step) + 1 }, (_, i) => i * step).map((g) =>
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#E1E7EE"/>' +
    '<text x="' + (pl - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="11" fill="#5A6B7D">' + g + '</text>').join('');
  const fmt = new Intl.DateTimeFormat('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' });
  const bars = days.map((d, i) => {
    const x = pl + i * slot + (slot - bw) / 2, h = H - pb - y(d.calls), r = Math.min(4, h);
    const label = fmt.format(new Date(d.day + 'T12:00:00Z'));
    const shape = d.calls > 0
      ? '<path d="M' + x + ',' + (H - pb) + 'V' + (y(d.calls) + r) + 'Q' + x + ',' + y(d.calls) + ' ' + (x + r) + ',' + y(d.calls) + 'H' + (x + bw - r) + 'Q' + (x + bw) + ',' + y(d.calls) + ' ' + (x + bw) + ',' + (y(d.calls) + r) + 'V' + (H - pb) + 'Z" fill="' + (i === n - 1 ? '#1556C0' : '#6E9BE0') + '"/>'
      : '';
    const tick = n <= 7 || (n - 1 - i) % 2 === 0 ? '<text x="' + (x + bw / 2) + '" y="' + (H - 10) + '" text-anchor="middle" font-size="11" fill="#5A6B7D">' + label + '</text>' : '';
    // A full-height invisible hit area carries the hover label.
    return shape + tick + '<rect x="' + (pl + i * slot) + '" y="' + pt + '" width="' + slot + '" height="' + (H - pt - pb) + '" fill="transparent"><title>' + label + ': ' + d.calls + (d.calls === 1 ? ' call' : ' calls') + '</title></rect>';
  }).join('');
  const today = days[n - 1];
  const todayLabel = today && today.calls > 0 ? '<text x="' + (pl + (n - 1) * slot + slot / 2) + '" y="' + (y(today.calls) - 7) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#0F2438">' + today.calls + '</text>' : '';
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Calls per day for the last ' + n + ' days. Today: ' + (today ? today.calls : 0) + '.">' + grid + bars + todayLabel + '</svg>';
}

  // The site-wide AI budget (CallReady's own count; Google AI Studio has the official one).

  const aiCard = '<section class="block"><div class="block-head"><h2>AI budget</h2></div><div class="card aib">' +
    aiRow('Requests today', ai.today.requests, ai.today.cap,
      ai.today.cap ? 'New calls stop at ' + n(ai.today.newCallsStopAt) + '; calls already running can finish.' : 'No daily cap set.') +
    aiRow('Tokens today', ai.today.tokens, ai.today.tokenCap, 'The day resets at midnight Pacific time, like Google\'s free quota.') +
    aiRow('Requests this month', ai.month.requests, ai.month.cap, 'CallReady\'s own count. Google AI Studio shows the official numbers.') +
    '</div></section>';
  const topMax = Math.max(1, ...o.topScenarios.map((s) => s.calls));
  const top = o.topScenarios.length
    ? o.topScenarios.map((s) => '<div class="score"><span>' + esc(s.title) + '</span><span class="meter" role="img" aria-label="' + esc(s.title) + ': ' + s.calls + ' calls"><i style="width:' + (s.calls / topMax * 100) + '%"></i></span><b>' + s.calls + '</b></div>').join('')
    : '<p class="muted">No calls in the last 30 days.</p>';

  root().innerHTML = adminFrame('overview',
    '<section class="hero"><h1>Overview</h1><p class="sub">How CallReady is doing. Numbers cover the last 7 days unless noted; days follow ' + esc(o.timeZone) + ' time.</p>' +
    '<div class="pillbar">' + I.phone + n(t.callsToday) + (t.callsToday === 1 ? ' call' : ' calls') + ' today</div></section>' +
    '<div class="stats kpis">' +
    tile('user', n(t.users), 'Users', '+' + n(t.newUsers7d) + ' this week') +
    tile('star', n(t.proUsers), 'Pro users', t.users ? Math.round(t.proUsers / t.users * 100) + '% of users' : '') +
    tile('phone', n(t.calls7d), 'Calls', 'last 7 days') +

    '<div class="cols">' +

    '<div><section class="block"><div class="block-head"><h2>New users</h2><a class="btn link" href="#/admin/users">All users</a></div><div class="card list">' + users + '</div></section>' +

async function adminView(tab, arg, vid) {
  if (!me.isAdmin) { location.hash = '#/scenarios'; return; }
  // One listener on the app root survives the tab re-renders; the router's cleanup removes it.
  const onSignOut = async (ev) => {
    if (!ev.target.closest('[data-signout]')) return;
    if (confirm('Sign out on this device?')) await sb.auth.signOut();
  };
  root().addEventListener('click', onSignOut);
  cleanup = () => root().removeEventListener('click', onSignOut);
  const known = tab === 'scenario' ? 'scenarios' : tab;
  root().innerHTML = adminFrame(known, '<p class="muted" id="loading">Loading…</p>');
  const fail = (e) => {
    if (vid !== viewId) return;
    root().innerHTML = adminFrame(known, '<div class="note err">' + esc(errMsg(e)) + '<br><button class="btn" id="retry">Try again</button></div>');
    $('#retry').addEventListener('click', render);
  };
  try {
    if (tab === 'users') return await adminUsersView(vid);
    if (tab === 'usage') return await adminUsageView(vid);
    if (tab === 'scenarios') return await adminScenariosView(vid);
    if (tab === 'scenario') return await adminScenarioEdit(arg, vid);
    if (tab === 'settings') return await adminSettingsView(vid);
    return await adminOverviewView(vid);
  } catch (e) { fail(e); }
}

async function adminUsersView(vid) {
  const q = parseHash().q.get('q') || '';
  let users = [], total = 0;
  const load = async (offset) => {
    const r = await api('/admin/users?q=' + encodeURIComponent(q) + '&offset=' + offset);
    users = users.concat(r.users); total = r.total;
  };
  await load(0);
  if (vid !== viewId) return;
  const today = new Date().toISOString().slice(0, 10);

  function card(u) {
    const status = u.proActive
      ? '<span class="pill pro">' + (u.proUntil ? 'Pro until ' + esc(proEndText(u.proUntil)) : 'Pro, no end date') + '</span>'
      : (u.isPro ? '<span class="pill off">Pro expired</span>' : '<span class="pill">Free</span>');
    return '<article class="card" data-user="' + esc(u.userId) + '"><b>' + esc(u.email) + '</b> ' + status +
      (u.role ? ' <span class="pill">' + esc(ROLE_NAMES[u.role]) + '</span>' : '') +
      '<div class="muted small" style="margin-top:4px">Joined ' + fmtDate(u.createdAt, true) + ' · Last active ' + fmtDate(u.lastSeenAt, true) + '</div>' +
      '<div class="small">Calls: ' + u.calls + ' · Avg QA: ' + (u.avgQa === null ? '—' : u.avgQa) + ' · AI tokens: ' + u.tokens.toLocaleString('en-US') + '</div>' +
      '<div class="row-actions"><label class="small" for="d-' + esc(u.userId) + '">Pro until</label>' +
      '<input class="in" type="date" id="d-' + esc(u.userId) + '" min="' + today + '" aria-describedby="h-' + esc(u.userId) + '">' +
      '<button class="btn" data-pro="on">Give Pro</button>' +
      (u.isPro ? '<button class="btn danger" data-pro="off">Remove Pro</button>' : '') +
      '<span class="muted small" id="h-' + esc(u.userId) + '">No date = no end date.</span></div>' +
      '<div class="note err small" role="alert" hidden style="margin:8px 0 0"></div></article>';
  }

  function draw() {
    root().innerHTML = adminFrame('users',
      '<form class="search" id="search" role="search"><input class="in" type="search" id="q" placeholder="Search by email" aria-label="Search by email" value="' + esc(q) + '"><button class="btn">Search</button></form>' +
      '<p class="muted small" style="margin-bottom:10px">' + total + (total === 1 ? ' user' : ' users') + (q ? ' matching "' + esc(q) + '"' : '') + '</p>' +
      users.map(card).join('') +
      (users.length < total ? '<button class="btn block" id="more">Load more</button>' : ''));
    $('#search').addEventListener('submit', (ev) => {
      ev.preventDefault();
      location.hash = '#/admin/users?q=' + encodeURIComponent($('#q').value.trim());
    });
    const more = $('#more');
    if (more) more.addEventListener('click', async () => { more.disabled = true; await load(users.length); draw(); });
    root().querySelectorAll('[data-user]').forEach((cardEl) => {
      const id = cardEl.dataset.user;
      cardEl.querySelectorAll('[data-pro]').forEach((b) => b.addEventListener('click', async () => {
        const on = b.dataset.pro === 'on';
        const until = on ? cardEl.querySelector('input[type=date]').value : null;
        const err = cardEl.querySelector('.note.err');
        b.disabled = true;
        try {
          await api('/admin/users/' + id + '/pro', { isPro: on, proUntil: until || null });
          const u = users.find((x) => x.userId === id);
          const r = await api('/admin/users?q=' + encodeURIComponent(u.email));
          const fresh = r.users.find((x) => x.userId === id);
          if (fresh) Object.assign(u, fresh);
          draw();
        } catch (e) {
          b.disabled = false; err.hidden = false; err.textContent = e.message || errMsg(e);
        }
      }));
    });
  }
  draw();
}

    ev.preventDefault();
    const val = (fid) => $('#' + fid).value.trim();
    const lines = (fid) => $('#' + fid).value.split('\n').map((x) => x.trim()).filter(Boolean);
    const err = $('#sf-err');
    const sid = isNew ? val('f-id') : v.id;
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(sid)) { err.hidden = false; err.textContent = 'The ID can only have lowercase letters, numbers and hyphens.'; return; }
    const account = [];
    for (const line of lines('f-acct')) {
      const at = line.indexOf(':');
      if (at < 1 || !line.slice(at + 1).trim()) { err.hidden = false; err.textContent = 'Each account line needs "Label: Value". Check: ' + line; return; }
      account.push({ label: line.slice(0, at).trim(), value: line.slice(at + 1).trim() });
    }
    const scenario = {
      id: sid, title: val('f-title'), summary: val('f-sum'), callType: val('f-type'), temperament: val('f-temper'), tier: val('f-tier'),
      company: val('f-company'), persona: { name: val('f-pn'), background: val('f-pb'), speechStyle: val('f-ps') },
      goal: val('f-goal'), account: account, policies: lines('f-pol'), hiddenFacts: lines('f-facts'),
    };
    if (val('f-notes')) scenario.behaviorNotes = val('f-notes');
    const b = $('#sf-save'); b.disabled = true;
    try {
      await api('/admin/scenarios/' + encodeURIComponent(sid), { scenario: scenario, enabled: $('#f-on').checked }, 'PUT');
      scenarioCache = null;
      location.hash = '#/admin/scenarios?saved=1';
    } catch (e) {
      b.disabled = false; err.hidden = false;
      err.textContent = e.code === 'invalid_request' ? 'Check the fields: ' + e.message : errMsg(e);
    }
  });
}

async function adminSettingsView(vid) {
  const s = await api('/admin/settings');
  if (vid !== viewId) return;
  root().innerHTML = adminFrame('settings',
    '<form id="stf" novalidate>' +
    '<div class="field"><label for="lim">Free calls per day</label><input class="in" id="lim" type="number" min="0" max="100" step="1" value="' + s.freeDailyLimit + '" style="max-width:140px"><small>For accounts without Pro. Scenarios marked Pro always need Pro.</small></div>' +
    '<div class="field"><label for="ins">How to get Pro (shown to learners)</label><textarea class="in" id="ins" maxlength="1000" style="min-height:140px">' + esc(s.proInstructions) + '</textarea><small>For example, how to pay and who to tell. Then turn on Pro for them under Users.</small></div>' +
    '<div class="note err" id="st-err" role="alert" hidden></div><div class="note ok" id="st-ok" role="status" hidden>Settings saved.</div>' +
    '<button class="btn primary" id="st-save">Save</button></form>' +
    '<section class="block" style="margin-top:28px"><h2>Appearance</h2><div class="group">' + darkSwitch() + '</div></section>');
  bindDarkSwitch();
  $('#stf').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = $('#st-err'), ok = $('#st-ok'), b = $('#st-save');
    err.hidden = true; ok.hidden = true; b.disabled = true;
    try {
      await api('/admin/settings', { freeDailyLimit: Number($('#lim').value), proInstructions: $('#ins').value }, 'PUT');
      ok.hidden = false; me = null;
    } catch (e) {
      err.hidden = false; err.textContent = e.code === 'invalid_request' ? 'Check the fields: ' + e.message : errMsg(e);
    }
    b.disabled = false;
  });
}

/* ---------- start ---------- */
async function boot() {
  root().innerHTML = loadingView();
  const stop = slowNotice();
  let cfg;
  try {
    const r = await fetch(API_BASE + '/config');
    if (!r.ok) throw new Error('config');
    cfg = await r.json();
  } catch {
    stop();
    errorView('CallReady', null, boot);
    return;
  }
  stop();
  if (!window.supabase) { errorView('CallReady', null, () => location.reload()); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    // PKCE puts the sign-in result in ?code=, which leaves the #/ routes alone.
    auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
  });
  const params = new URLSearchParams(location.search);
  const { data, error } = await sb.auth.getSession();
  session = data.session;
  if (error || params.get('error')) loginNotice = 'Sign-in could not be completed. Try again.';
  if (params.has('code') || params.has('error')) history.replaceState(null, '', location.pathname + location.hash);

  // Navigate, or re-render when already there (setting the same hash fires no hashchange).
  const go = (hash) => { if (location.hash === hash) render(); else location.hash = hash; };
  sb.auth.onAuthStateChange((event, s) => {
    const was = session;
    session = s;
    // Never await Supabase calls inside this callback; schedule the re-render instead.
    if (event === 'SIGNED_OUT' || (!s && was)) { me = null; setTimeout(() => go('#/login'), 0); }
    else if (s && !was) { me = null; setTimeout(() => (parseHash().name === 'login' || !location.hash ? go('#/') : render()), 0); }
  });
  window.addEventListener('hashchange', render);
  render();
}

boot();
</script>
