<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C2340">
<title>CallReady</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2218%22 fill=%22%231556C0%22/%3E%3Cpath d=%22M20 17h8l4 10-5 3a22 22 0 0 0 10 10l3-5 10 4v8a4 4 0 0 1-4 4A32 32 0 0 1 16 21a4 4 0 0 1 4-4z%22 fill=%22none%22 stroke=%22white%22 stroke-width=%224%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --card:#fff; --ink:#0F2438; --muted:#5A6B7D; --line:#E1E7EE; --line-2:#D3DCE6;
  --cobalt:#1556C0; --cobalt-d:#0F4299; --cobalt-50:#EEF4FE; --cobalt-100:#D9E6FB;
  --maize:#F2B33D; --maize-50:#FFF6E0; --night:#0C2340; --night2:#16386A; --night3:#1E4A8A;
  --good:#17835A; --good-50:#E4F4EC; --bad:#B93A3A; --bad-50:#FBEBEB;
  --sh-1:0 1px 2px rgba(15,36,56,.05),0 2px 8px rgba(15,36,56,.05);
  --sh-2:0 2px 4px rgba(15,36,56,.06),0 10px 24px rgba(15,36,56,.10);
  --sh-btn:0 1px 2px rgba(15,66,153,.25),0 6px 16px rgba(21,86,192,.28);
  --r:18px;
  --display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:400 16px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  background:radial-gradient(900px 420px at 50% -160px,#DCE7F8 0%,rgba(220,231,248,0) 70%),var(--paper);background-attachment:fixed}
body.in-call{background:var(--night)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
a.btn,a.icon-btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn.block{display:flex}
:focus-visible{outline:3px solid var(--cobalt);outline-offset:2px}
.call :focus-visible,.hero :focus-visible{outline-color:var(--maize)}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.015em;line-height:1.15}
h1{font-size:28px;font-weight:700}
h2{font-size:19px;font-weight:700}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}
#app{max-width:640px;margin:0 auto;min-height:100%;padding:env(safe-area-inset-top) 16px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;padding:22px 0 14px}
.top h1{flex:1}
.lead{font-size:17px;color:var(--muted);margin:8px 0 22px;max-width:52ch}
section.block{margin-top:28px}
section.block>h2{margin-bottom:12px}
.section-sub{color:var(--muted);font-size:14px;margin:-6px 0 12px}

/* entrance motion */
main>*{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
main>*:nth-child(2){animation-delay:.03s} main>*:nth-child(3){animation-delay:.06s}
main>*:nth-child(4){animation-delay:.09s} main>*:nth-child(n+5){animation-delay:.12s}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* brand */
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.logo{width:36px;height:36px;flex:none;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(140deg,#2C74E6 0%,var(--cobalt) 55%,var(--cobalt-d) 100%);box-shadow:0 4px 12px rgba(21,86,192,.35),inset 0 1px 0 rgba(255,255,255,.25)}
.logo svg{width:20px;height:20px}

/* hero band */
.hero{position:relative;overflow:hidden;margin:0 -16px 18px;padding:24px 20px 22px;color:#fff;border-radius:0 0 28px 28px;
  background:linear-gradient(160deg,var(--night3) 0%,var(--night2) 38%,var(--night) 100%);box-shadow:0 12px 30px rgba(12,35,64,.22)}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(4px)}
.hero::before{width:260px;height:260px;right:-70px;top:-110px;background:radial-gradient(circle,rgba(242,179,61,.38),rgba(242,179,61,0) 68%)}
.hero::after{width:300px;height:300px;left:-120px;bottom:-190px;background:radial-gradient(circle,rgba(70,140,255,.45),rgba(70,140,255,0) 70%)}
.hero>*{position:relative;z-index:1}
.hero .brand{font-size:17px;margin-bottom:18px;opacity:.95}
.hero .brand .logo{width:30px;height:30px;border-radius:9px}
.hero .brand .logo svg{width:17px;height:17px}
.hero h1{font-size:30px;color:#fff}
.hero p.sub{color:rgba(255,255,255,.78);margin-top:6px;font-size:16px;max-width:46ch}
.hero .top{padding:0 0 4px}
.hero .icon-btn{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);color:#fff}
.pillbar{display:inline-flex;align-items:center;gap:10px;margin-top:16px;padding:8px 14px;border-radius:99px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-size:15px;font-weight:600;backdrop-filter:blur(6px)}
.dots{display:inline-flex;gap:5px}
.dots i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.28)}
.dots i.on{background:var(--maize);box-shadow:0 0 0 3px rgba(242,179,61,.25)}
@media (min-width:680px){ .hero{margin:16px 0 20px;border-radius:28px} }

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:14px;padding:12px 18px;font-weight:600;min-height:48px;
  box-shadow:var(--sh-1);transition:transform .12s ease,box-shadow .12s ease,background .12s ease}
.btn:hover:not(:disabled){box-shadow:var(--sh-2)}
.btn:active:not(:disabled){transform:translateY(1px);box-shadow:var(--sh-1)}
.btn.primary{background:linear-gradient(180deg,#2466D4 0%,var(--cobalt) 100%);border-color:var(--cobalt-d);color:#fff;box-shadow:var(--sh-btn)}
.btn.primary:hover:not(:disabled){background:linear-gradient(180deg,#1C5CC8 0%,var(--cobalt-d) 100%)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn.block{display:block;width:100%}
.stack{display:grid;gap:10px;margin-top:24px}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);box-shadow:var(--sh-1)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:0 12px calc(10px + env(safe-area-inset-bottom));z-index:10;pointer-events:none}
.tabs-in{display:flex;width:100%;max-width:520px;gap:4px;padding:6px;border-radius:22px;pointer-events:auto;
  background:rgba(255,255,255,.86);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);
  border:1px solid rgba(211,220,230,.8);box-shadow:0 10px 30px rgba(12,35,64,.16)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 7px;border-radius:16px;color:var(--muted);text-decoration:none;font-size:13px;font-weight:600;transition:background .15s,color .15s}
.tabs a[aria-current=page]{color:var(--cobalt);background:var(--cobalt-50)}

/* onboarding */
fieldset{border:0;padding:0;margin:0 0 24px}
legend{font-family:var(--display);font-weight:700;font-size:20px;margin-bottom:10px;padding:0}
.choice{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:2px solid transparent;border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-1);transition:box-shadow .15s,border-color .15s,transform .12s}
.choice:hover{box-shadow:var(--sh-2)}
.choice b{display:block;font-size:17px}
.choice span.d{color:var(--muted);font-size:15px}
.choice .ico{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt)}
.choice .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line-2);display:grid;place-items:center;color:#fff}
.choice .tick svg{width:14px;height:14px;stroke-width:3;opacity:0}
.choice[aria-pressed=true]{border-color:var(--cobalt);background:linear-gradient(180deg,#fff,var(--cobalt-50))}
.choice[aria-pressed=true] .tick{background:var(--cobalt);border-color:var(--cobalt)}
.choice[aria-pressed=true] .tick svg{opacity:1}

/* scenario list */
.counter{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border-radius:14px;padding:10px 14px;margin-bottom:14px;font-size:15px;box-shadow:var(--sh-1)}
.counter b{font-family:var(--display)}
.sc{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh-1);transition:transform .15s ease,box-shadow .15s ease}
.sc:hover{transform:translateY(-2px);box-shadow:var(--sh-2)}
.sc:active{transform:translateY(0)}
.sc-ico{width:52px;height:52px;border-radius:15px;display:grid;place-items:center;align-self:start}
.sc-ico svg{width:26px;height:26px}
.cat-support{background:#E8F0FD;color:#1556C0}
.cat-sales{background:#FFF1D6;color:#9A5B00}
.cat-interview{background:#E5F3EC;color:#146B4A}
.sc-main{display:grid;gap:4px;min-width:0}
.sc-main b{font-size:17px;line-height:1.25}
.sc-main .sum{color:var(--muted);font-size:15px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:4px;font-size:13px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:99px;font-size:13px;font-weight:600;background:#EEF2F6;color:var(--ink)}
.chip.fit{background:var(--good-50);color:#0E6B47}
.chip.pro{background:var(--maize-50);color:#7A4E00}
.chip svg{width:13px;height:13px;stroke-width:2.4}
.lvl{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:24px;padding:0 8px;border-radius:99px;font-weight:700;font-size:12.5px;font-family:var(--body);letter-spacing:.02em}
.lvl-A2{background:#E1F3EA;color:#0E6B47}
.lvl-B1{background:#E4EDFB;color:#0F4299}
.lvl-B2{background:#FBEBC8;color:#7A4E00}
.sc-go{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt);transition:background .15s,color .15s}
.sc:hover .sc-go{background:var(--cobalt);color:#fff}
.sc.locked .sc-go{background:var(--maize-50);color:#9A5B00}
.sc.locked .sc-main b{color:#334B63}
.sc-go svg{width:18px;height:18px}
.note{background:var(--maize-50);border:1px solid #F0D592;border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.note.err{background:var(--bad-50);border-color:#EBC0C0}
.note.ok{background:var(--good-50);border-color:#A9D8C1}
.note .btn{margin-top:10px;min-height:40px;padding:8px 14px}

/* call */
.call{position:fixed;inset:0;z-index:20;color:#fff;display:flex;flex-direction:column;max-width:640px;margin:0 auto;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
  background:radial-gradient(520px 340px at 50% 70px,rgba(46,110,214,.45),rgba(46,110,214,0) 70%),radial-gradient(400px 300px at 50% 105%,rgba(242,179,61,.10),transparent 70%),var(--night)}
.call-top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 4px}
.timer{font-family:var(--body);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.1)}
.hang{background:linear-gradient(180deg,#CC4646,var(--bad));border:0;color:#fff;border-radius:14px;padding:10px 18px;font-weight:700;min-height:44px;box-shadow:0 6px 16px rgba(185,58,58,.35)}
.caller{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:8px 0 4px}
.avatar{width:84px;height:84px;border-radius:50%;background:linear-gradient(150deg,#2A5DAA,var(--night2));display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:30px;
  border:3px solid rgba(255,255,255,.2);box-shadow:0 0 0 8px rgba(255,255,255,.05),0 10px 30px rgba(0,0,0,.35);transition:border-color .2s,box-shadow .2s}
.avatar.speaking{border-color:var(--maize);animation:talk 1.4s ease-in-out infinite}
@keyframes talk{0%,100%{box-shadow:0 0 0 8px rgba(242,179,61,.10),0 10px 30px rgba(0,0,0,.35)}50%{box-shadow:0 0 0 16px rgba(242,179,61,.05),0 10px 30px rgba(0,0,0,.35)}}
.cname{font-family:var(--display);font-weight:700;font-size:22px;margin-top:8px}
.cstatus{font-size:15px;color:rgba(255,255,255,.78);min-height:22px}
.wave{display:flex;gap:5px;height:28px;align-items:center;justify-content:center;margin:6px 0}
.wave span{width:5px;height:8px;border-radius:3px;background:rgba(255,255,255,.3)}
.wave.on span{background:var(--maize);animation:wv 900ms ease-in-out infinite}
.wave.on span:nth-child(2){animation-delay:-.7s}
.wave.on span:nth-child(3){animation-delay:-.4s}
.wave.on span:nth-child(4){animation-delay:-.55s}
.wave.on span:nth-child(5){animation-delay:-.2s}
@keyframes wv{0%,100%{height:8px}50%{height:26px}}
.transcript{flex:1;overflow-y:auto;padding:6px 2px 10px;display:flex;flex-direction:column}
.b{max-width:86%;padding:10px 14px;border-radius:18px;margin:5px 0;font-size:16px;line-height:1.45;overflow-wrap:anywhere;animation:rise .2s ease both}
.b.c{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.08);border-bottom-left-radius:6px;align-self:flex-start}
.b.a{background:linear-gradient(180deg,#F6C25C,var(--maize));color:#2A1D00;border-bottom-right-radius:6px;align-self:flex-end;box-shadow:0 4px 14px rgba(242,179,61,.25)}
.b.live{background:rgba(242,179,61,.22);color:#fff;font-style:italic;align-self:flex-end;border-bottom-right-radius:6px}
.call .note{color:var(--ink);margin:6px 0}
#hint .note{margin:4px 0 0}
.bar{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;margin:10px 0 12px;padding:8px;border-radius:22px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.10)}
.mic{width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(180deg,#F6C25C,var(--maize));color:#2A1D00;display:grid;place-items:center;position:relative;box-shadow:0 6px 18px rgba(242,179,61,.35)}
.mic:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.mic.on{background:#fff;color:var(--bad)}
.mic.on::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid #fff;animation:ring 1.2s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.9)}to{opacity:0;transform:scale(1.3)}}
.bar input{min-width:0;height:48px;border-radius:14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#fff;padding:0 14px;font-size:16px}
.bar input::placeholder{color:rgba(255,255,255,.55)}
.bar input:disabled{opacity:.5}
.send{height:48px;border-radius:14px;border:0;background:#fff;color:var(--night);font-weight:700;padding:0 16px}
.send:disabled{opacity:.5;cursor:not-allowed}
.skip{background:none;border:0;color:rgba(255,255,255,.75);text-decoration:underline;font-size:14px;padding:4px 8px}
.overlay{position:absolute;inset:0;background:radial-gradient(500px 300px at 50% 40%,rgba(46,110,214,.35),transparent 70%),var(--night);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;z-index:5}
.overlay p{max-width:36ch;font-size:17px}
.overlay .btn{min-width:200px}
.spinner{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.2);border-top-color:var(--maize);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* feedback */
.hero .avg{display:flex;align-items:baseline;gap:10px;margin:14px 0 6px}
.avg-n{font-family:var(--body);font-weight:700;font-size:64px;line-height:1;letter-spacing:-.02em}
.avg-of{font-size:16px;color:rgba(255,255,255,.75)}
.hero .summary{color:rgba(255,255,255,.88);font-size:16px;line-height:1.5;max-width:52ch}
.card{background:var(--card);border:1px solid transparent;border-radius:var(--r);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh-1)}
.card b{overflow-wrap:anywhere}
.scores{display:grid;gap:14px}
.score{display:grid;grid-template-columns:150px 1fr 26px;gap:12px;align-items:center;font-size:15px}
.meter{height:8px;border-radius:99px;background:var(--cobalt-100);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--cobalt)}
.score b{text-align:right;font-weight:700}
.fix{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;display:grid;gap:10px;box-shadow:var(--sh-1)}
.fix .row{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.fix .mk{width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.fix .mk svg{width:15px;height:15px;stroke-width:2.6}
.said .mk{background:var(--bad-50);color:var(--bad)} .better .mk{background:var(--good-50);color:var(--good)}
.fix .lbl{display:block;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:1px}
.said q{text-decoration:line-through;text-decoration-color:rgba(185,58,58,.55);text-decoration-thickness:1.5px;color:#5B3030}
.better q{font-weight:600;color:#0E4F36}
q{quotes:none}
.why{display:grid;grid-template-columns:28px 1fr;gap:10px;border-top:1px solid var(--line);padding-top:10px;color:var(--ink)}
.why .mk{background:var(--maize-50);color:#9A5B00}
.phrase{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;background:var(--card);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh-1)}
.phrase b{font-size:17px}
.play{width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--cobalt-50);color:var(--cobalt);transition:background .15s,color .15s}
.play:hover{background:var(--cobalt);color:#fff}

/* progress */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh-1)}
.stat .si{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;margin-bottom:8px}
.stat .si svg{width:17px;height:17px}
.stat b{display:block;font-family:var(--body);font-weight:700;font-size:28px;line-height:1.1}
.stat span{font-size:13.5px;color:var(--muted)}
.hero .stats{margin-top:18px}
.hero .stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);box-shadow:none;backdrop-filter:blur(6px)}
.hero .stat span{color:rgba(255,255,255,.75)}
.si.flame{background:rgba(242,179,61,.22);color:var(--maize)} .si.trophy{background:rgba(255,255,255,.14);color:#fff} .si.phone{background:rgba(110,165,255,.22);color:#A9C8FF}
.chart{background:var(--card);border-radius:var(--r);padding:14px 12px 8px;box-shadow:var(--sh-1)}
.chart svg{display:block;width:100%;height:auto}
.hist{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh-1);transition:transform .15s,box-shadow .15s}
.hist:hover{transform:translateY(-1px);box-shadow:var(--sh-2)}
.hist .sc-ico{width:42px;height:42px;border-radius:12px;align-self:center}
.hist .sc-ico svg{width:21px;height:21px}
.hist .sc-n{min-width:52px;text-align:center;font-weight:700;font-size:18px;padding:6px 10px;border-radius:12px;background:var(--cobalt-50);color:var(--cobalt-d)}

const LEVELS = ['A2', 'B1', 'B2'];

function dateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function dayNumber(key) {
  const p = key.split('-').map(Number);
  return Math.floor(Date.UTC(p[0], p[1] - 1, p[2]) / 86400000);
}

// dateKeys: local 'YYYY-MM-DD' strings with at least one call. today: Date.
// The current streak stays alive if the last practice day was today or yesterday.
function computeStreak(dateKeys, today) {
  const days = Array.from(new Set(dateKeys)).map(dayNumber).sort(function (a, b) { return a - b; });
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    run = prev !== null && d === prev + 1 ? run + 1 : 1;
    if (run > best) best = run;
    prev = d;
  }
  const todayN = dayNumber(dateKey(today));
  const last = days.length ? days[days.length - 1] : null;
  let current = 0;
  if (last !== null && (last === todayN || last === todayN - 1)) {
    current = 1;
    let i = days.length - 1;
    while (i > 0 && days[i - 1] === days[i] - 1) { current++; i--; }
  }
  return { current: current, best: best };
}

// Mirrors the server's rule so the page can explain a refusal before trying. The server has the final word.
// Free: `limit` calls per day, free-tier scenarios only. Pro: no limits.
function canStartCall(o) {
  if (o.isPro) return { ok: true, reason: null };
  if (o.scenario.tier === 'pro') return { ok: false, reason: 'pro_required' };
  if (o.startsToday >= o.limit) return { ok: false, reason: 'daily_limit' };
  return { ok: true, reason: null };
}

function avgScores(scores) {
  const vals = SCORE_KEYS.map(function (k) { return Number(scores[k]); }).filter(Number.isFinite);
  if (!vals.length) return 0;
  return Math.round(vals.reduce(function (a, b) { return a + b; }, 0) / vals.length * 10) / 10;
}

// Levels closest to the learner first; interviews first for job seekers. Stable otherwise.
function sortScenarios(list, profile) {
  const lv = LEVELS.indexOf(profile && profile.level);
  return list
    .map(function (s, i) {
      let k = lv < 0 ? 0 : Math.abs(LEVELS.indexOf(s.difficulty) - lv);
      if (profile && profile.goal === 'job' && s.category === 'interview') k -= 0.5;
      return { s: s, i: i, k: k };
    })
    .sort(function (a, b) { return a.k - b.k || a.i - b.i; })
    .map(function (x) { return x.s; });
}

function formatTime(sec) {
  const s = Math.max(0, Math.floor(sec));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}

function trendPoints(calls, n) {
  return calls.slice()
    .sort(function (a, b) { return a.startedAt < b.startedAt ? -1 : a.startedAt > b.startedAt ? 1 : 0; })
    .slice(-(n || 20))
    .map(function (c) { return c.avg; });
}

// "Ya usó sus 2 llamadas gratis de hoy." with the right number and plural.
function freeUsedText(limit) {
  if (limit <= 0) return 'Hoy no hay llamadas gratis disponibles.';
  if (limit === 1) return 'Ya usó su llamada gratis de hoy.';
  return 'Ya usó sus ' + limit + ' llamadas gratis de hoy.';
}
/* LOGIC:END */

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// Only small per-browser preferences live here; account data lives on the server.

  set(k, v) { try { localStorage.setItem('callready.' + k, JSON.stringify(v)); } catch { /* storage full or blocked */ } },
};
const autoSend = () => store.get('autoSend', true) !== false;

function uuid() {
  if (crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
  const h = Array.from(b, (x) => x.toString(16).padStart(2, '0'));
  return [h.slice(0, 4).join(''), h.slice(4, 6).join(''), h.slice(6, 8).join(''), h.slice(8, 10).join(''), h.slice(10).join('')].join('-');
}

  if (e.code === 'rate_limited' && e.retryAfter) return 'Se enviaron muchas solicitudes seguidas. Intente de nuevo en ' + e.retryAfter + ' segundos.';

}

let session = null;   // current Supabase session, or null
let me = null;        // GET /me
const callCache = {}; // feedback just generated, so the feedback page does not refetch it

async function authHeader() {
  if (!sb) return {};
  const { data } = await sb.auth.getSession();
  const t = data && data.session && data.session.access_token;
  return t ? { Authorization: 'Bearer ' + t } : {};
}

async function api(path, body, method) {
  const m = method || (body === undefined ? 'GET' : 'POST');
  const headers = await authHeader();
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  let res;
  try {
    res = await fetch(API_BASE + path, { method: m, headers: headers, body: body === undefined ? undefined : JSON.stringify(body) });
  } catch { const e = new Error('network'); e.code = 'network'; throw e; }
  let data = null;
  try { data = await res.json(); } catch { /* non-JSON error body */ }
  if (!res.ok) {
    const e = new Error(data && data.error ? data.error.message : 'error');
    e.code = (data && data.error && data.error.code) || 'unknown';
    e.status = res.status; e.retryAfter = res.headers.get('Retry-After');
    if (res.status === 401 && sb) { me = null; sb.auth.signOut().catch(() => {}); }
    throw e;
  }
  return data;
}

async function loadMe() {
  me = await api('/me');

let scenarioCache = null;
async function getScenarios() {

  scenarioCache = (await r.json()).scenarios;
  return scenarioCache;
}

  const tabs = [['scenarios', 'Llamadas', I.phone], ['progress', 'Progreso', I.chart], ['settings', 'Ajustes', I.gear]];
  return '<main>' + inner + '</main><nav class="tabs" aria-label="Principal"><div class="tabs-in">' +
    tabs.map((t) => '<a href="#/' + t[0] + '"' + (active === t[0] ? ' aria-current="page"' : '') + '>' + t[2] + '<span>' + t[1] + '</span></a>').join('') +
    '</div></nav>';
}
const brandMark = () => '<div class="brand"><span class="logo" aria-hidden="true">' + I.logo + '</span>CallReady</div>';
const CAT = { support: ['cat-support', I.headset], sales: ['cat-sales', I.tag], interview: ['cat-interview', I.briefcase] };
const catIcon = (category) => { const c = CAT[category] || CAT.support; return '<span class="sc-ico ' + c[0] + '" aria-hidden="true">' + c[1] + '</span>'; };
function backHeader(title, href) {
  return '<header class="top"><a class="icon-btn" href="' + href + '" aria-label="Volver">' + I.back + '</a><h1>' + esc(title) + '</h1></header>';
}
function loadingView(title) {

// The free Render server sleeps when idle and takes up to a minute to wake up.
function slowNotice() {
  const t = setTimeout(() => { const el = $('#loading'); if (el) el.textContent = 'Despertando el servidor… La primera carga puede tardar hasta un minuto.'; }, 4000);
  return () => clearTimeout(t);
}
function errorView(title, e, retry) {
  root().innerHTML = '<main>' + (title ? '<header class="top"><h1>' + esc(title) + '</h1></header>' : '') +
    '<div class="note err">' + esc(e && e.code ? errMsg(e) : 'No se pudo conectar con el servidor. Verifique su conexión e intente de nuevo.') +
    '<br><button class="btn" id="retry">Reintentar</button></div></main>';
  $('#retry').addEventListener('click', retry);
}

/* ---------- speech ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
function pickVoice() {
  if (!('speechSynthesis' in window)) return null;
  const v = speechSynthesis.getVoices();
  return v.find((x) => x.lang === 'en-US' && /google|natural|samantha|aria/i.test(x.name)) ||
    v.find((x) => x.lang === 'en-US') || v.find((x) => /^en/i.test(x.lang)) || null;
}
function speak(text, rate) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    let done = false;
    const finish = () => { if (!done) { done = true; clearTimeout(timer); resolve(); } };
    // Some Chrome versions never fire onend on long text; fall back to an estimate.
    const timer = setTimeout(finish, 4000 + text.length * 95);
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US'; u.rate = rate || 0.95;
      const v = pickVoice(); if (v) u.voice = v;
      u.onend = finish; u.onerror = finish;
      speechSynthesis.speak(u);
    } catch { finish(); }
  });
}
function stopSpeech() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch { /* ignore */ } }

/* ---------- router ---------- */
let viewId = 0;
let cleanup = () => {};

function parseHash() {
  const h = location.hash.replace(/^#\/?/, '');
  const parts = h.split('?');
  const seg = parts[0].split('/').map((x) => decodeURIComponent(x));
  return { name: seg[0] || '', arg: seg[1] || '', arg2: seg[2] || '', q: new URLSearchParams(parts[1] || '') };
}

async function render() {
  cleanup(); cleanup = () => {};
  const vid = ++viewId;
  const r = parseHash();
  window.scrollTo(0, 0);
  document.body.classList.toggle('in-call', r.name === 'call');
  document.body.classList.toggle('wide', r.name === 'admin');

  if (!session) {
    if (r.name !== 'login') { location.hash = '#/login'; return; }
    return loginView(vid);
  }
  if (r.name === 'login') { location.hash = '#/'; return; }
  if (!me) {
    root().innerHTML = loadingView();
    const stop = slowNotice();
    try { await loadMe(); } catch (e) { stop(); if (vid === viewId && session) errorView('CallReady', e, render); return; }
    stop();
    if (vid !== viewId) return;
  }
  // Admins start in Administración; learners on the call list.
  if (!r.name && me.isAdmin) { location.hash = '#/admin'; return; }
  // Goal and level matter only for practicing, so the admin area does not ask for them.
  if (!me.goal && r.name !== 'onboarding' && r.name !== 'admin') { location.hash = '#/onboarding'; return; }
  switch (r.name) {
    case 'onboarding': return onboardingView();
    case 'progress': return progressView(vid);
    case 'settings': return settingsView();
    case 'pro': return proView(r.q.get('why'));
    case 'feedback': return feedbackView(r.arg, vid);
    case 'call': return callView(r.arg, vid);
    case 'admin': return adminView(r.arg || 'users', r.arg2, vid);
    default: return scenariosView(vid);
  }
}

/* ---------- sign-in ---------- */
let loginNotice = '';

function authErrText(error) {
  const msg = String((error && error.message) || '').toLowerCase();
  if ((error && error.status === 429) || /rate limit|too many|seconds/.test(msg)) return 'Se pidieron demasiados códigos. Espere un minuto e intente de nuevo.';
  if (/expired|invalid|otp|token/.test(msg)) return 'El código no es correcto o ya venció. Revise el correo o pida uno nuevo.';
  return 'No se pudo iniciar sesión. Intente de nuevo.';
}

function loginView() {
  const appUrl = location.origin + location.pathname;
  let email = '';
  root().innerHTML = '<main><section class="hero login-hero">' + brandMark() +
    '<h1>Practique llamadas reales en inglés</h1>' +
    '<p class="sub">Un cliente de IA le llama, usted responde, y recibe retroalimentación en español.</p>' +
    '<div class="bubbles" aria-hidden="true"><span class="c">Hi, my internet stopped working this morning.</span><span class="a">I\'m sorry to hear that. Let me help you.</span></div></section>' +
    '<div class="login-card"><h2 style="margin-bottom:14px">Iniciar sesión</h2>' +
    (loginNotice ? '<div class="note err" role="alert">' + esc(loginNotice) + '</div>' : '') +
    '<button class="btn google" id="google">' + I.google + 'Continuar con Google</button>' +
    '<div class="divider">o con su correo</div>' +
    '<div id="step"></div></div>' +
    '<p class="muted small" style="margin-top:18px;text-align:center">Si todavía no tiene una cuenta, se crea al entrar. Consulte la <a href="privacidad.html">política de privacidad</a>.</p></main>';
  loginNotice = '';

  $('#google').addEventListener('click', async () => {
    const { error } = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: appUrl } });
    if (error) showStepError(authErrText(error));
  });

  function showStepError(text) {
    const n = $('#step-err'); if (!n) return;
    n.hidden = !text; n.textContent = text || '';
  }

  function emailStep() {
    $('#step').innerHTML = '<form id="f-email" novalidate><div class="field"><label for="email">Correo electrónico</label>' +
      '<input class="in" id="email" type="email" autocomplete="email" inputmode="email" required value="' + esc(email) + '"></div>' +
      '<div class="note err" id="step-err" role="alert" hidden></div>' +
      '<button class="btn primary block" id="send-code">Enviar código</button></form>';
    $('#f-email').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      email = $('#email').value.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showStepError('Escriba un correo válido.'); return; }
      const b = $('#send-code'); b.disabled = true; b.textContent = 'Enviando…';
      const { error } = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true, emailRedirectTo: appUrl } });
      if (error) { b.disabled = false; b.textContent = 'Enviar código'; showStepError(authErrText(error)); return; }
      codeStep();
    });
  }

  function codeStep() {
    $('#step').innerHTML = '<form id="f-code" novalidate><p style="margin-bottom:14px">Le enviamos un código de 6 dígitos a <b>' + esc(email) + '</b>. Si no lo ve, revise la carpeta de correo no deseado.</p>' +
      '<div class="field"><label for="code">Código</label>' +
      '<input class="in code-in" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" required></div>' +
      '<div class="note err" id="step-err" role="alert" hidden></div>' +
      '<button class="btn primary block" id="verify">Entrar</button></form>' +
      '<div class="row-actions"><button class="btn link" id="other">Usar otro correo</button><button class="btn link" id="resend" disabled>Reenviar código (60)</button></div>';
    $('#code').focus();
    let left = 60;
    const timer = setInterval(() => {
      const r = $('#resend'); if (!r) { clearInterval(timer); return; }
      left--; r.textContent = left > 0 ? 'Reenviar código (' + left + ')' : 'Reenviar código'; r.disabled = left > 0;
      if (left <= 0) clearInterval(timer);
    }, 1000);
    cleanup = () => clearInterval(timer);
    $('#other').addEventListener('click', () => { clearInterval(timer); emailStep(); });
    $('#resend').addEventListener('click', async () => {
      const { error } = await sb.auth.signInWithOtp({ email: email, options: { shouldCreateUser: true, emailRedirectTo: appUrl } });
      showStepError(error ? authErrText(error) : '');
      if (!error) { clearInterval(timer); codeStep(); }
    });
    $('#f-code').addEventListener('submit', async (ev) => {
      ev.preventDefault();
      const token = $('#code').value.replace(/\D/g, '');
      if (token.length < 6) { showStepError('Escriba el código de 6 dígitos.'); return; }
      const b = $('#verify'); b.disabled = true; b.textContent = 'Verificando…';
      const { error } = await sb.auth.verifyOtp({ email: email, token: token, type: 'email' });
      if (error) { b.disabled = false; b.textContent = 'Entrar'; showStepError(authErrText(error)); return; }
      // onAuthStateChange moves on to the app.
    });
  }

  emailStep();
}

  let goal = me.goal || null, level = me.level || null;
  const goals = [
    ['job', 'Conseguir empleo', 'Quiero prepararme para entrevistas y para mi primer trabajo en un call center.'],
    ['improve', 'Mejorar en mi trabajo actual', 'Ya trabajo atendiendo llamadas y quiero hablar mejor inglés con los clientes.'],

  root().innerHTML = '<main>' + (first
    ? '<section class="hero">' + brandMark() + '<h1>Le damos la bienvenida</h1><p class="sub">Dos preguntas rápidas para elegir las llamadas que más le sirven.</p></section>'
    : backHeader('Objetivo y nivel', '#/settings')) +
    '<fieldset><legend>¿Cuál es su objetivo?</legend>' + goals.map((x) => choice(goal, x[0], x[1], x[2], 'goal')).join('') + '</fieldset>' +
    '<fieldset><legend>¿Cómo calificaría su inglés hoy?</legend>' + levels.map((x) => choice(level, x[0], x[1], x[2], 'level')).join('') + '</fieldset>' +
    '<div class="note err" id="err" role="alert" hidden></div>' +
    '<button class="btn primary block" id="go" disabled>' + (first ? 'Empezar' : 'Guardar') + '</button></main>';
  const go = $('#go');
  const sync = () => { go.disabled = !(goal && level); };
  const bind = (attr, set) => root().querySelectorAll('[data-' + attr + ']').forEach((b) => b.addEventListener('click', () => {

    root().querySelectorAll('[data-' + attr + ']').forEach((o) => o.setAttribute('aria-pressed', String(o === b)));
    sync();

  bind('level', (v) => { level = v; });

function scenariosHero(extra) {
  return '<section class="hero">' + brandMark() + '<h1>Elija una llamada</h1>' +
    '<p class="sub">La IA hace de cliente. Usted atiende la llamada en inglés.</p>' + (extra || '') + '</section>';

async function scenariosView(vid) {
  root().innerHTML = shell(scenariosHero() + '<p class="muted" id="loading">Cargando…</p>', 'scenarios');
  const stop = slowNotice();
  let list;
  try { [list] = await Promise.all([getScenarios(), loadMe()]); } catch (e) {
    stop();
    if (vid !== viewId) return;
    root().innerHTML = shell(scenariosHero() + '<div class="note err">No se pudieron cargar las llamadas. Verifique que el servidor esté activo.<br><button class="btn" id="retry">Reintentar</button></div>', 'scenarios');
    $('#retry').addEventListener('click', () => scenariosView(vid));
    return;
  }
  stop();
  if (vid !== viewId) return;
  const used = Math.min(me.callsToday, me.freeDailyLimit);
  const counter = me.isPro
    ? '<div class="pillbar">' + I.star + 'Pro activo · llamadas ilimitadas</div>'
    : '<div class="pillbar"><span class="dots" aria-hidden="true">' +
      Array.from({ length: me.freeDailyLimit }, (_, i) => '<i class="' + (i < used ? 'on' : '') + '"></i>').join('') +
      '</span>Llamadas gratis de hoy: ' + used + ' de ' + me.freeDailyLimit + '</div>';
  const cards = sortScenarios(list, me).map((s) => {
    const locked = !me.isPro && s.tier === 'pro';
    return '<button class="sc' + (locked ? ' locked' : '') + '" data-id="' + esc(s.id) + '">' + catIcon(s.category) +
      '<span class="sc-main"><b>' + esc(s.title.es) + '</b><span class="sum">' + esc(s.summaryEs) + '</span>' +
      '<span class="meta"><span class="lvl lvl-' + s.difficulty + '" title="' + LEVEL_NAMES[s.difficulty] + '">' + s.difficulty + '</span>' +
      '<span>con ' + esc(s.personaName) + '</span>' +
      (s.difficulty === me.level ? '<span class="chip fit">' + I.check + 'Para su nivel</span>' : '') +
      (locked ? '<span class="chip pro">' + I.lock + 'Pro</span>' : '') + '</span></span>' +
      '<span class="sc-go" aria-hidden="true">' + (locked ? I.lock : I.chevron) + '</span></button>';
  }).join('');
  root().innerHTML = shell(scenariosHero(counter) + '<div id="msg" class="note" role="status" hidden></div>' + cards, 'scenarios');
  root().querySelectorAll('.sc').forEach((b) => b.addEventListener('click', () => {
    const s = list.find((x) => x.id === b.dataset.id);
    const gate = canStartCall({ isPro: me.isPro, scenario: s, startsToday: me.callsToday, limit: me.freeDailyLimit });
    if (gate.ok) { location.hash = '#/call/' + encodeURIComponent(s.id); return; }
    if (gate.reason === 'pro_required') { location.hash = '#/pro?why=pro_required'; return; }
    const m = $('#msg');
    m.hidden = false;
    m.innerHTML = esc(freeUsedText(me.freeDailyLimit)) + ' Vuelva mañana o conozca Pro para practicar sin límite.<br><a class="btn" href="#/pro?why=daily_limit" style="display:inline-block;margin-top:10px;text-decoration:none">Ver Pro</a>';
    m.scrollIntoView({ block: 'nearest' });
  }));
}

/* ---------- call ---------- */
async function callView(id, vid) {
  let list;
  try { list = await getScenarios(); } catch {
    if (vid !== viewId) return;
    root().innerHTML = '<main>' + backHeader('Llamada', '#/scenarios') + '<div class="note err">No se pudo cargar la llamada. Verifique que el servidor esté activo.</div></main>';
    return;
  }
  if (vid !== viewId) return;
  const sc = list.find((s) => s.id === id);
  if (!sc) { location.hash = '#/scenarios'; return; }
  const gate = canStartCall({ isPro: me.isPro, scenario: sc, startsToday: me.callsToday, limit: me.freeDailyLimit });
  if (!gate.ok) { location.hash = '#/pro?why=' + gate.reason; return; }

  const sessionId = uuid();
  const who = sc.aiRole === 'interviewer' ? 'El entrevistador' : 'El cliente';
  const rate = sc.difficulty === 'A2' ? 0.85 : sc.difficulty === 'B1' ? 0.95 : 1;
  const initials = sc.personaName.replace(/^(Mr|Mrs|Ms|Dr)\.\s*/i, '').split(/\s+/).map((w) => w[0]).join('').slice(0, 2).toUpperCase();
  const secure = window.isSecureContext;
  const state = { history: [], busy: false, speaking: false, listening: false, ended: false, started: false, rec: null, startTs: Date.now() };

  root().innerHTML =
    '<section class="call" aria-label="Llamada con ' + esc(sc.personaName) + '">' +
    '<div class="call-top"><button class="hang" id="hang">Colgar</button><div class="timer" id="timer" aria-label="Duración">00:00</div></div>' +
    '<div class="caller"><div class="avatar" id="avatar" aria-hidden="true">' + esc(initials) + '</div>' +
    '<div class="cname">' + esc(sc.personaName) + '</div><div class="cstatus" id="status" role="status" aria-live="polite">Conectando…</div></div>' +
    '<div class="wave" id="wave" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>' +
    '<div class="transcript" id="tr" aria-label="Transcripción"></div>' +
    '<div id="notice" hidden></div><div id="hint"></div>' +
    '<div class="bar"><button class="mic" id="mic" aria-label="Hablar" title="Hablar">' + I.mic + '</button>' +
    '<input id="txt" type="text" maxlength="500" autocomplete="off" autocapitalize="sentences" placeholder="Escriba su respuesta en inglés" aria-label="Su respuesta en inglés">' +
    '<button class="send" id="send">Enviar</button></div></section>';

  const el = (s) => $(s);
  const timer = setInterval(() => { const t = el('#timer'); if (t) t.textContent = formatTime((Date.now() - state.startTs) / 1000); }, 1000);
  cleanup = () => {
    state.ended = true; clearInterval(timer); stopSpeech();
    try { if (state.rec) state.rec.abort(); } catch { /* ignore */ }
  };

  const agentTurns = () => state.history.filter((m) => m.role === 'agent').length;

  function setStatus(text, mode) {
    const s = el('#status'); if (s) s.textContent = text;
    const a = el('#avatar'); if (a) a.classList.toggle('speaking', mode === 'speaking');
    const w = el('#wave'); if (w) w.classList.toggle('on', mode === 'speaking' || mode === 'listening');
  }
  function updateUi() {
    const mic = el('#mic'), txt = el('#txt'), send = el('#send');
    if (!mic) return;
    const blocked = state.busy || state.speaking || state.ended;
    mic.disabled = blocked || !SR || !secure;
    mic.classList.toggle('on', state.listening);
    mic.setAttribute('aria-label', state.listening ? 'Detener' : 'Hablar');
    txt.disabled = blocked; send.disabled = blocked;
  }
  function addBubble(kind, text) {
    const tr = el('#tr'); if (!tr) return null;
    const d = document.createElement('div');
    d.className = 'b ' + kind; d.textContent = text;
    tr.appendChild(d); tr.scrollTop = tr.scrollHeight;
    return d;
  }
  function showNotice(msg, actions, isError) {
    const n = el('#notice'); if (!n) return;
    n.hidden = false;
    n.innerHTML = '<div class="note' + (isError ? ' err' : '') + '" role="alert">' + esc(msg) +
      (actions || []).map((a, i) => '<br><button class="btn" data-act="' + i + '">' + esc(a.label) + '</button>').join('') + '</div>';
    (actions || []).forEach((a, i) => n.querySelector('[data-act="' + i + '"]').addEventListener('click', () => { hideNotice(); a.fn(); }));
  }
  function hideNotice() { const n = el('#notice'); if (n) { n.hidden = true; n.innerHTML = ''; } }

  function hint() {
    const msg = !SR ? 'Este navegador no permite reconocimiento de voz. Use Chrome o Edge, o escriba sus respuestas abajo.'
      : !secure ? 'El micrófono solo funciona en una página segura (HTTPS o localhost). Mientras tanto, escriba sus respuestas abajo.' : '';
    const h = el('#hint');
    if (h && msg) h.innerHTML = '<div class="note small">' + esc(msg) + '</div>';
  }

  async function requestTurn() {
    state.busy = true; updateUi(); hideNotice();
    setStatus(state.started ? who + ' está respondiendo…' : 'Conectando…');
    try {
      const data = await api('/session/turn', { sessionId: sessionId, scenarioId: sc.id, history: state.history });
      if (state.ended) return;
      state.history.push({ role: 'customer', text: data.line });
      if (!state.started) { state.started = true; me.callsToday++; }
      addBubble('c', data.line);
      state.busy = false; state.speaking = true; updateUi();
      setStatus(who + ' está hablando…', 'speaking');
      const skip = document.createElement('button');
      skip.className = 'skip'; skip.textContent = 'Saltar audio';
      skip.addEventListener('click', stopSpeech);
      const st = el('.cstatus'); if (st) st.appendChild(skip);
      await speak(data.line, rate);
      skip.remove();
      state.speaking = false;
      if (state.ended) return;
      if (data.callEnded) { await finishCall(); return; }
      setStatus('Es su turno. Toque el micrófono o escriba.');
      const t = el('#txt'); if (t && !state.busy) { updateUi(); t.focus({ preventScroll: true }); }
    } catch (e) {
      if (state.ended) return;
      state.busy = false; state.speaking = false;
      if (e.code === 'pro_required' || e.code === 'daily_limit') { cleanup(); location.hash = '#/pro?why=' + e.code; return; }
      if (e.code === 'unauthorized') { cleanup(); return; }
      if (e.code === 'session_token_cap' && agentTurns() >= 2) { showNotice(errMsg(e)); await finishCall(); return; }
      setStatus('Sin conexión con la llamada');
      showNotice(errMsg(e), [{ label: 'Reintentar', fn: requestTurn }], true);
    } finally {
      if (!state.ended) { state.busy = false; updateUi(); }
    }
  }

  async function sendAgent(raw) {
    const text = String(raw || '').trim().slice(0, 500);
    if (!text || state.busy || state.speaking || state.ended) return;
    state.history.push({ role: 'agent', text: text });
    addBubble('a', text);
    const t = el('#txt'); if (t) t.value = '';
    await requestTurn();
  }

  const MIC_ERR = {
    'not-allowed': 'El navegador no tiene permiso para usar el micrófono. Permítalo desde el candado de la barra de direcciones, o escriba su respuesta.',
    'service-not-allowed': 'El navegador no tiene permiso para usar el micrófono. Permítalo desde el candado de la barra de direcciones, o escriba su respuesta.',
    'no-speech': 'No se escuchó nada. Intente de nuevo o escriba su respuesta.',
    'audio-capture': 'No se encontró un micrófono.',
    'network': 'El reconocimiento de voz necesita internet. Escriba su respuesta mientras tanto.',
    'language-not-supported': 'Este navegador no reconoce inglés por voz. Escriba su respuesta.',
  };

  function startMic() {
    if (!SR || !secure || state.busy || state.speaking || state.ended) return;
    hideNotice();
    const r = new SR();
    r.lang = 'en-US'; r.interimResults = true; r.continuous = false; r.maxAlternatives = 1;
    let finalText = '', lastErr = null, live = null;
    r.onresult = (e) => {
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) finalText += res[0].transcript + ' '; else interim += res[0].transcript;
      }
      const shown = (finalText + interim).trim();
      if (!live) live = addBubble('live', shown); else { live.textContent = shown; const tr = el('#tr'); if (tr) tr.scrollTop = tr.scrollHeight; }
    };
    r.onerror = (e) => { lastErr = e.error; };
    r.onend = () => {
      state.listening = false; state.rec = null;
      if (live) live.remove();
      if (state.ended) return;
      setStatus('Es su turno. Toque el micrófono o escriba.'); updateUi();
      const text = finalText.trim();
      if (text) {
        if (autoSend()) sendAgent(text); else { const t = el('#txt'); t.value = text; t.focus(); }
      } else if (lastErr && lastErr !== 'aborted') {
        showNotice(MIC_ERR[lastErr] || 'No se pudo usar el micrófono. Escriba su respuesta.');
      } else if (!lastErr) {
        showNotice(MIC_ERR['no-speech']);
      }
    };
    try { r.start(); } catch { showNotice('No se pudo iniciar el micrófono. Escriba su respuesta.'); return; }
    state.rec = r; state.listening = true; updateUi(); setStatus('Escuchando… hable en inglés', 'listening');
  }
  function stopMic() { try { if (state.rec) state.rec.stop(); } catch { /* ignore */ } }

  function overlay(html, actions) {
    const c = el('.call'); if (!c) return;
    let o = el('.overlay'); if (!o) { o = document.createElement('div'); o.className = 'overlay'; c.appendChild(o); }
    o.innerHTML = html;
    (actions || []).forEach((a, i) => { const b = document.createElement('button'); b.className = 'btn' + (i === 0 ? ' primary' : ''); b.textContent = a.label; b.addEventListener('click', a.fn); o.appendChild(b); });
  }

  async function finishCall() {
    state.ended = true; clearInterval(timer); stopSpeech(); stopMic();
    if (agentTurns() < 2) { location.hash = '#/scenarios'; return; }
    await generateFeedback();
  }
  async function generateFeedback() {
    overlay('<div class="spinner" aria-hidden="true"></div><p>Preparando su retroalimentación…</p>');
    try {
      const fb = await api('/session/feedback', { sessionId: sessionId, scenarioId: sc.id, history: state.history });
      const feedback = { scores: fb.scores, corrections: fb.corrections, phrases: fb.phrases, overallSummaryEs: fb.overallSummaryEs };
      callCache[fb.callId] = {
        id: fb.callId, scenarioId: sc.id, titleEs: sc.title.es, difficulty: sc.difficulty,
        startedAt: new Date(state.startTs).toISOString(), durationSec: Math.round((Date.now() - state.startTs) / 1000),
        avg: avgScores(fb.scores), feedback: feedback,
      };
      location.hash = '#/feedback/' + fb.callId;
    } catch (e) {
      const actions = e.code === 'not_enough_speech' || e.code === 'session_token_cap' || e.code === 'not_found'
        ? [{ label: 'Volver a las llamadas', fn: () => { location.hash = '#/scenarios'; } }]
        : [{ label: 'Reintentar', fn: generateFeedback }, { label: 'Salir sin guardar', fn: () => { location.hash = '#/scenarios'; } }];
      overlay('<p>' + esc(errMsg(e)) + '</p>', actions);
    }
  }

  el('#mic').addEventListener('click', () => { if (state.listening) stopMic(); else startMic(); });
  el('#send').addEventListener('click', () => sendAgent(el('#txt').value));
  el('#txt').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); sendAgent(el('#txt').value); } });
  el('#hang').addEventListener('click', () => {
    if (state.ended) return;
    if (agentTurns() < 2) {
      if (confirm('Todavía no hay suficiente conversación para dar retroalimentación. ¿Salir de la llamada?')) { cleanup(); location.hash = '#/scenarios'; }
      return;
    }
    if (confirm('¿Colgar y ver su retroalimentación?')) finishCall();
  });

  hint(); updateUi();
  requestTurn();
}

/* ---------- progress ---------- */
function trendSvg(vals) {
  const W = 320, H = 150, px = 28, py = 22, n = vals.length;
  const x = (i) => (n === 1 ? W / 2 : px + i * (W - 2 * px) / (n - 1));
  const y = (v) => H - py - (v - 1) / 9 * (H - 2 * py);
  const grid = [1, 5, 10].map((g) => '<line x1="' + px + '" x2="' + (W - 8) + '" y1="' + y(g) + '" y2="' + y(g) + '" stroke="#E1E7EE" stroke-width="1"/><text x="' + (px - 8) + '" y="' + (y(g) + 4) + '" text-anchor="end" font-size="11" fill="#5A6B7D">' + g + '</text>').join('');
  const pts = vals.map((v, i) => x(i) + ',' + y(v)).join(' ');
  const area = n > 1 ? '<polygon points="' + x(0) + ',' + y(1) + ' ' + pts + ' ' + x(n - 1) + ',' + y(1) + '" fill="url(#tg)"/>' : '';
  // Visible dot with a surface ring, plus a larger invisible hit area that carries the hover label.
  const dots = vals.map((v, i) => '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="4.5" fill="#1556C0" stroke="#fff" stroke-width="2"/>' +
    '<circle cx="' + x(i) + '" cy="' + y(v) + '" r="13" fill="transparent"><title>Llamada ' + (i + 1) + ': ' + v.toFixed(1) + ' de 10</title></circle>').join('');
  const last = vals[n - 1];
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Puntaje promedio por llamada. Último: ' + last.toFixed(1) + ' de 10.">' +
    '<defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1556C0" stop-opacity=".18"/><stop offset="1" stop-color="#1556C0" stop-opacity="0"/></linearGradient></defs>' + grid + area +
    (n > 1 ? '<polyline points="' + pts + '" fill="none" stroke="#1556C0" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' : '') + dots +
    '<text x="' + Math.min(x(n - 1), W - 16) + '" y="' + (y(last) - 10) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#0F2438">' + last.toFixed(1) + '</text></svg>';
}

const progressHero = (extra) => '<section class="hero">' + brandMark() + '<h1>Su progreso</h1>' + (extra || '') + '</section>';

async function progressView(vid) {
  root().innerHTML = shell(progressHero() + '<p class="muted" id="loading">Cargando…</p>', 'progress');
  let calls, list = [];
  try {
    [calls] = await Promise.all([api('/calls').then((r) => r.calls), getScenarios().then((l) => { list = l; }).catch(() => {})]);
  } catch (e) {
    if (vid !== viewId) return;
    root().innerHTML = shell(progressHero() + '<div class="note err">' + esc(errMsg(e)) + '<br><button class="btn" id="retry">Reintentar</button></div>', 'progress');
    $('#retry').addEventListener('click', () => progressView(vid));
    return;
  }
  if (vid !== viewId) return;
  const keys = calls.map((c) => dateKey(new Date(c.startedAt)));
  const streak = computeStreak(keys, new Date());
  const unit = (n) => (n === 1 ? 'día' : 'días');
  let body;
  if (!calls.length) {
    body = '<div class="empty"><p><b>Todavía no hay llamadas.</b></p><p class="muted">Su historial y su racha aparecerán aquí después de su primera práctica.</p><a class="btn primary" href="#/scenarios" style="display:inline-block;text-decoration:none">Hacer una llamada</a></div>';
  } else {
    const pts = trendPoints(calls, 20);
    const cat = (id) => { const s = list.find((x) => x.id === id); return s ? s.category : 'support'; };
    const hist = calls.map((c) =>
      '<a class="hist" href="#/feedback/' + encodeURIComponent(c.id) + '" style="color:inherit;text-decoration:none">' + catIcon(cat(c.scenarioId)) +
      '<span><b>' + esc(c.titleEs) + '</b><br><span class="muted small">' +
      fmtDate(c.startedAt) + ' · ' + formatTime(c.durationSec) + ' min · nivel ' + c.difficulty + '</span></span>' +
      '<span class="sc-n" aria-label="Promedio ' + Number(c.avg).toFixed(1) + ' de 10">' + Number(c.avg).toFixed(1) + '</span></a>').join('');
    body = '<section class="block"><h2>Puntaje promedio por llamada</h2><div class="chart">' + trendSvg(pts) + '</div>' +
      (pts.length < 2 ? '<p class="muted small" style="margin-top:8px">Haga otra llamada para ver cómo cambia su puntaje.</p>' : '') + '</section>' +
      '<section class="block"><h2>Historial</h2>' + hist + '</section>';
  }
  const stats = '<div class="stats">' +
    '<div class="stat"><span class="si flame" aria-hidden="true">' + I.flame + '</span><b>' + streak.current + '</b><span>Racha actual (' + unit(streak.current) + ')</span></div>' +
    '<div class="stat"><span class="si trophy" aria-hidden="true">' + I.trophy + '</span><b>' + streak.best + '</b><span>Mejor racha (' + unit(streak.best) + ')</span></div>' +
    '<div class="stat"><span class="si phone" aria-hidden="true">' + I.phone + '</span><b>' + calls.length + '</b><span>Llamadas</span></div></div>';
  root().innerHTML = shell(progressHero(stats) + body, 'progress');
}

async function adminView(tab, arg, vid) {
  if (!me.isAdmin) { location.hash = '#/scenarios'; return; }
  // One listener on the app root survives the tab re-renders; the router's cleanup removes it.
  const onSignOut = async (ev) => {
    if (!ev.target.closest('[data-signout]')) return;
    if (confirm('¿Cerrar sesión en este dispositivo?')) await sb.auth.signOut();
  };
  root().addEventListener('click', onSignOut);
  cleanup = () => root().removeEventListener('click', onSignOut);
  const known = tab === 'scenario' ? 'scenarios' : tab;
  root().innerHTML = adminFrame(known, '<p class="muted" id="loading">Cargando…</p>');
  const fail = (e) => {
    if (vid !== viewId) return;
    root().innerHTML = adminFrame(known, '<div class="note err">' + esc(errMsg(e)) + '<br><button class="btn" id="retry">Reintentar</button></div>');
    $('#retry').addEventListener('click', render);
  };
  try {
    if (tab === 'usage') return await adminUsageView(vid);
    if (tab === 'scenarios') return await adminScenariosView(vid);
    if (tab === 'scenario') return await adminScenarioEdit(arg, vid);
    if (tab === 'settings') return await adminSettingsView(vid);
    return await adminUsersView(vid);

async function adminUsersView(vid) {
  const params = parseHash().q;
  const q = params.get('q') || '';
  let users = [], total = 0;
  const load = async (offset) => {
    const r = await api('/admin/users?q=' + encodeURIComponent(q) + '&offset=' + offset);
    users = users.concat(r.users); total = r.total;
  };
  await load(0);
  if (vid !== viewId) return;
  const today = new Date().toISOString().slice(0, 10);

  function card(u) {
    const status = u.proActive
      ? '<span class="pill pro">' + (u.proUntil ? 'Pro hasta el ' + esc(proEndText(u.proUntil)) : 'Pro sin vencimiento') + '</span>'
      : (u.isPro ? '<span class="pill off">Pro vencido</span>' : '<span class="pill">Gratis</span>');
    return '<article class="card" data-user="' + esc(u.userId) + '"><b>' + esc(u.email) + '</b> ' + status +
      '<div class="muted small" style="margin-top:4px">Alta: ' + fmtDate(u.createdAt, true) + ' · Última actividad: ' + fmtDate(u.lastSeenAt, true) + '</div>' +
      '<div class="small">Llamadas: ' + u.calls + ' · Promedio: ' + (u.avgScore === null ? '—' : u.avgScore.toFixed(1)) + ' · Tokens: ' + u.tokens.toLocaleString('es-HN') + '</div>' +
      '<div class="row-actions"><label class="small" for="d-' + esc(u.userId) + '">Pro hasta</label>' +
      '<input class="in" type="date" id="d-' + esc(u.userId) + '" min="' + today + '" aria-describedby="h-' + esc(u.userId) + '">' +
      '<button class="btn" data-pro="on">Dar Pro</button>' +
      (u.isPro ? '<button class="btn danger" data-pro="off">Quitar Pro</button>' : '') +
      '<span class="muted small" id="h-' + esc(u.userId) + '">Sin fecha = sin vencimiento.</span></div>' +
      '<div class="note err small" role="alert" hidden style="margin:8px 0 0"></div></article>';
  }

  function draw() {
    root().innerHTML = adminFrame('users',
      '<form class="search" id="search" role="search"><input class="in" type="search" id="q" placeholder="Buscar por correo" aria-label="Buscar por correo" value="' + esc(q) + '"><button class="btn">Buscar</button></form>' +
      '<p class="muted small" style="margin-bottom:10px">' + total + (total === 1 ? ' usuario' : ' usuarios') + (q ? ' con «' + esc(q) + '»' : '') + '</p>' +
      users.map(card).join('') +
      (users.length < total ? '<button class="btn block" id="more">Cargar más</button>' : ''));
    $('#search').addEventListener('submit', (ev) => {
      ev.preventDefault();
      location.hash = '#/admin/users?q=' + encodeURIComponent($('#q').value.trim());
    });
    const more = $('#more');
    if (more) more.addEventListener('click', async () => { more.disabled = true; await load(users.length); draw(); });
    root().querySelectorAll('[data-user]').forEach((cardEl) => {
      const id = cardEl.dataset.user;
      cardEl.querySelectorAll('[data-pro]').forEach((b) => b.addEventListener('click', async () => {
        const on = b.dataset.pro === 'on';
        const until = on ? cardEl.querySelector('input[type=date]').value : null;
        const err = cardEl.querySelector('.note.err');
        b.disabled = true;
        try {
          await api('/admin/users/' + id + '/pro', { isPro: on, proUntil: until || null });
          const u = users.find((x) => x.userId === id);
          const r = await api('/admin/users?q=' + encodeURIComponent(u.email));
          const fresh = r.users.find((x) => x.userId === id);
          if (fresh) Object.assign(u, fresh);
          draw();
        } catch (e) {
          b.disabled = false; err.hidden = false; err.textContent = e.message || errMsg(e);
        }
      }));
    });
  }
  draw();
}

  const rows = u.byDay.map((d) => '<tr><td>' + esc(fmtDate(d.day + 'T12:00:00Z', true)) + '</td><td>' + d.calls + '</td><td>' + d.users + '</td><td>' + n(d.tokens) + '</td><td>' + (d.avgScore === null ? '—' : d.avgScore.toFixed(1)) + '</td></tr>').join('');
  root().innerHTML = adminFrame('usage',
    '<div class="row-actions" style="margin:0 0 14px"><label for="days" class="small">Período</label><select class="in" id="days">' +
    [7, 30, 90].map((d) => '<option value="' + d + '"' + (d === u.days ? ' selected' : '') + '>Últimos ' + d + ' días</option>').join('') + '</select></div>' +
    '<div class="stats four"><div class="stat"><span class="si" aria-hidden="true">' + I.phone + '</span><b>' + u.totals.calls + '</b><span>Llamadas</span></div>' +
    '<div class="stat"><span class="si" aria-hidden="true">' + I.user + '</span><b>' + u.totals.users + '</b><span>Usuarios activos</span></div>' +
    '<div class="stat"><span class="si" aria-hidden="true">' + I.chart + '</span><b>' + n(u.totals.tokens) + '</b><span>Tokens de IA</span></div>' +
    '<div class="stat"><span class="si" aria-hidden="true">' + I.trophy + '</span><b>' + (u.totals.avgScore === null ? '—' : u.totals.avgScore.toFixed(1)) + '</b><span>Puntaje promedio</span></div></div>' +
    '<section class="block"><h2>Por día</h2><div class="tbl-wrap"><table class="tbl"><thead><tr><th scope="col">Día</th><th scope="col">Llamadas</th><th scope="col">Usuarios</th><th scope="col">Tokens</th><th scope="col">Promedio</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    '<p class="muted small" style="margin-top:8px">Días según la hora de ' + esc(u.timeZone) + '. Solo cuentan las llamadas en las que la IA respondió.</p></section>');
  $('#days').addEventListener('change', (e) => { location.hash = '#/admin/usage?days=' + e.target.value; });
}

async function adminScenariosView(vid) {
  const { scenarios } = await api('/admin/scenarios');
  if (vid !== viewId) return;
  const note = parseHash().q.get('saved');
  root().innerHTML = adminFrame('scenarios',
    (note ? '<div class="note ok" role="status">Escenario guardado.</div>' : '') +
    '<a class="btn primary" href="#/admin/scenario/new" style="margin-bottom:14px">Nuevo escenario</a>' +
    scenarios.map((s) => '<div class="card sc-row">' + catIcon(s.category) +
      '<span><b>' + esc(s.title.es) + '</b><br><span class="meta" style="margin-top:2px"><span class="lvl lvl-' + s.difficulty + '">' + s.difficulty + '</span>' +
      '<span>' + esc(s.id) + ' · ' + (s.tier === 'pro' ? 'Pro' : 'Gratis') + ' · ' + esc(s.persona.name) + '</span></span></span>' +
      '<span class="row-actions" style="margin:0"><label class="small"><input class="sw" type="checkbox" role="switch" data-toggle="' + esc(s.id) + '"' + (s.enabled ? ' checked' : '') + ' aria-label="Activo: ' + esc(s.title.es) + '"></label>' +
      '<a class="btn" href="#/admin/scenario/' + encodeURIComponent(s.id) + '">Editar</a></span></div>').join(''));
  root().querySelectorAll('[data-toggle]').forEach((t) => t.addEventListener('change', async () => {
    t.disabled = true;
    try { await api('/admin/scenarios/' + encodeURIComponent(t.dataset.toggle) + '/enabled', { enabled: t.checked }); scenarioCache = null; }
    catch (e) { t.checked = !t.checked; alert(errMsg(e)); }
    t.disabled = false;
  }));
}

async function adminScenarioEdit(id, vid) {
  const isNew = !id || id === 'new';
  let s = null;
  if (!isNew) {
    const { scenarios } = await api('/admin/scenarios');
    s = scenarios.find((x) => x.id === id);
    if (!s) { location.hash = '#/admin/scenarios'; return; }
  }
  if (vid !== viewId) return;
  const v = s || { id: '', title: { es: '', en: '' }, summaryEs: '', difficulty: 'B1', tier: 'free', category: 'support', aiRole: 'customer',
    persona: { name: '', background: '', mood: '', speechStyle: '' }, goal: '', hiddenFacts: [], expectedFlow: ['greeting', 'verification', 'empathy', 'resolution', 'closing'], difficultyNotes: '', enabled: false };
  const text = (fid, label, value, hint) => '<div class="field"><label for="' + fid + '">' + label + '</label><input class="in" id="' + fid + '" value="' + esc(value) + '">' + (hint ? '<small>' + hint + '</small>' : '') + '</div>';
  const area = (fid, label, value, hint) => '<div class="field"><label for="' + fid + '">' + label + '</label><textarea class="in" id="' + fid + '">' + esc(value) + '</textarea>' + (hint ? '<small>' + hint + '</small>' : '') + '</div>';
  const select = (fid, label, value, opts) => '<div class="field"><label for="' + fid + '">' + label + '</label><select class="in" id="' + fid + '">' + opts.map((o) => '<option value="' + o[0] + '"' + (o[0] === value ? ' selected' : '') + '>' + o[1] + '</option>').join('') + '</select></div>';

  root().innerHTML = adminFrame('scenarios',
    '<h2 style="margin-bottom:14px">' + (isNew ? 'Nuevo escenario' : esc(v.title.es)) + '</h2>' +
    '<form id="sf" novalidate>' +
    (isNew ? text('f-id', 'Identificador', '', 'Minúsculas, números y guiones, por ejemplo «hotel-booking». No se puede cambiar después.') : '<p class="muted small" style="margin-bottom:14px">Identificador: ' + esc(v.id) + '</p>') +
    '<div class="grid2">' + text('f-tes', 'Título en español', v.title.es) + text('f-ten', 'Título en inglés', v.title.en) + '</div>' +
    area('f-sum', 'Resumen para el alumno (español)', v.summaryEs) +
    '<div class="grid2">' +
    select('f-dif', 'Nivel', v.difficulty, [['A2', 'A2 (básico)'], ['B1', 'B1 (intermedio)'], ['B2', 'B2 (avanzado)']]) +
    select('f-tier', 'Plan', v.tier, [['free', 'Gratis'], ['pro', 'Pro']]) +
    select('f-cat', 'Categoría', v.category, [['support', 'Soporte'], ['sales', 'Ventas'], ['interview', 'Entrevista']]) +
    select('f-role', 'La IA hace de', v.aiRole, [['customer', 'Cliente'], ['interviewer', 'Entrevistador']]) +
    '</div>' +
    '<h2 style="margin:10px 0 12px">Personaje (en inglés)</h2>' +
    '<div class="grid2">' + text('f-pn', 'Nombre', v.persona.name, 'Por ejemplo «Mr. Tom Bennett».') + text('f-pm', 'Estado de ánimo', v.persona.mood) + '</div>' +
    area('f-pb', 'Trasfondo', v.persona.background) +
    text('f-ps', 'Forma de hablar', v.persona.speechStyle) +
    area('f-goal', 'Objetivo de la llamada (en inglés)', v.goal) +
    area('f-facts', 'Datos que conoce la IA (uno por línea, en inglés)', v.hiddenFacts.join('\n'), 'La IA los revela solo cuando se los piden.') +
    area('f-flow', 'Etapas esperadas de la llamada (una por línea, al menos 3)', v.expectedFlow.join('\n'), 'Se usan para calificar la estructura de la llamada.') +
    area('f-notes', 'Notas de dificultad (opcional, en inglés)', v.difficultyNotes) +
    '<label class="row-set"><span>Activo<small>Los alumnos pueden verlo y practicarlo.</small></span><input class="sw" type="checkbox" id="f-on" role="switch"' + (v.enabled ? ' checked' : '') + '></label>' +
    '<div class="note err" id="sf-err" role="alert" hidden></div>' +
    '<div class="stack"><button class="btn primary block" id="sf-save">Guardar</button><a class="btn block" href="#/admin/scenarios" style="text-align:center">Cancelar</a></div></form>');

  $('#sf').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const val = (fid) => $('#' + fid).value.trim();
    const lines = (fid) => $('#' + fid).value.split('\n').map((x) => x.trim()).filter(Boolean);
    const sid = isNew ? val('f-id') : v.id;
    const scenario = {
      id: sid, title: { es: val('f-tes'), en: val('f-ten') }, summaryEs: val('f-sum'),
      difficulty: val('f-dif'), tier: val('f-tier'), category: val('f-cat'), aiRole: val('f-role'),
      persona: { name: val('f-pn'), background: val('f-pb'), mood: val('f-pm'), speechStyle: val('f-ps') },
      goal: val('f-goal'), hiddenFacts: lines('f-facts'), expectedFlow: lines('f-flow'),
    };
    if (val('f-notes')) scenario.difficultyNotes = val('f-notes');
    const err = $('#sf-err');
    if (!/^[a-z0-9]+(-[a-z0-9]+)*$/.test(sid)) { err.hidden = false; err.textContent = 'El identificador solo puede tener minúsculas, números y guiones.'; return; }
    const b = $('#sf-save'); b.disabled = true;
    try {
      await api('/admin/scenarios/' + encodeURIComponent(sid), { scenario: scenario, enabled: $('#f-on').checked }, 'PUT');
      scenarioCache = null;
      location.hash = '#/admin/scenarios?saved=1';
    } catch (e) {
      b.disabled = false; err.hidden = false;
      err.textContent = e.code === 'invalid_request' ? 'Revise los datos: ' + e.message : errMsg(e);
    }
  });
}

async function adminSettingsView(vid) {
  const s = await api('/admin/settings');
  if (vid !== viewId) return;
  root().innerHTML = adminFrame('settings',
    '<form id="stf" novalidate>' +
    '<div class="field"><label for="lim">Llamadas gratis por día</label><input class="in" id="lim" type="number" min="0" max="100" step="1" value="' + s.freeDailyLimit + '" style="max-width:140px"><small>Para cuentas sin Pro. Los escenarios marcados como Pro siempre requieren Pro.</small></div>' +
    '<div class="field"><label for="ins">Cómo activar Pro (texto que ven los alumnos)</label><textarea class="in" id="ins" maxlength="1000" style="min-height:140px">' + esc(s.proInstructionsEs) + '</textarea><small>Por ejemplo, cómo pagar y a quién avisar. Luego active Pro al alumno en «Usuarios».</small></div>' +
    '<div class="note err" id="st-err" role="alert" hidden></div><div class="note ok" id="st-ok" role="status" hidden>Ajustes guardados.</div>' +
    '<button class="btn primary" id="st-save">Guardar</button></form>');
  $('#stf').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const err = $('#st-err'), ok = $('#st-ok'), b = $('#st-save');
    err.hidden = true; ok.hidden = true; b.disabled = true;
    try {
      await api('/admin/settings', { freeDailyLimit: Number($('#lim').value), proInstructionsEs: $('#ins').value }, 'PUT');
      ok.hidden = false; me = null;
    } catch (e) {
      err.hidden = false; err.textContent = e.code === 'invalid_request' ? 'Revise los datos: ' + e.message : errMsg(e);
    }
    b.disabled = false;
  });
}

/* ---------- start ---------- */
async function boot() {
  root().innerHTML = loadingView();
  const stop = slowNotice();
  let cfg;
  try {
    const r = await fetch(API_BASE + '/config');
    if (!r.ok) throw new Error('config');
    cfg = await r.json();
  } catch {
    stop();
    errorView('CallReady', null, boot);
    return;
  }
  stop();
  if (!window.supabase) { errorView('CallReady', null, () => location.reload()); return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey, {
    // PKCE puts the sign-in result in ?code=, which leaves the #/ routes alone.
    auth: { flowType: 'pkce', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true },
  });
  const params = new URLSearchParams(location.search);
  const { data, error } = await sb.auth.getSession();
  session = data.session;
  if (error || params.get('error')) loginNotice = 'No se pudo completar el inicio de sesión. Intente de nuevo.';
  if (params.has('code') || params.has('error')) history.replaceState(null, '', location.pathname + location.hash);

  // Navigate, or re-render when already there (setting the same hash fires no hashchange).
  const go = (hash) => { if (location.hash === hash) render(); else location.hash = hash; };
  sb.auth.onAuthStateChange((event, s) => {
    const was = session;
    session = s;
    // Never await Supabase calls inside this callback; schedule the re-render instead.
    if (event === 'SIGNED_OUT' || (!s && was)) { me = null; setTimeout(() => go('#/login'), 0); }
    else if (s && !was) { me = null; setTimeout(() => (parseHash().name === 'login' || !location.hash ? go('#/') : render()), 0); }
  });
  window.addEventListener('hashchange', render);
  render();
}

boot();
</script>
